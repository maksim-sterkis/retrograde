    <script>
const AudioSystem = {
    ctx: null,
    enabled: true,
    engineNode: null,
    engineGain: null,
    masterGain: null,
    effectsGain: null,

    init: function () {
        if (!this.enabled || this.ctx) return;
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.masterGain = this.ctx.createGain();
            this.effectsGain = this.ctx.createGain();
            this.masterGain.connect(this.ctx.destination);
            this.effectsGain.connect(this.masterGain);
            this.updateVolumes();
            
            if (typeof MusicSystem !== 'undefined') {
                MusicSystem.init(this.ctx);
                MusicSystem.start();
            }
        } catch (e) {
            console.warn("Web Audio API not supported");
            this.enabled = false;
        }
    },

    updateVolumes: function () {
        if (this.masterGain) this.masterGain.gain.value = saveData.masterVolume;
        if (this.effectsGain) this.effectsGain.gain.value = saveData.effectsVolume;
        if (typeof MusicSystem !== 'undefined') MusicSystem.updateVolume();
    },

    playBlip: function (freq = 440, type = 'square', duration = 0.1) {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },

    playExplosion: function () {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        let bufferSize = this.ctx.sampleRate * 1.5; // 1.5 seconds
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        let noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        let filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(1000, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 1.5);
        let gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1.5);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.effectsGain);
        noise.start();
    },

    startEngine: function () {
        if (!this.ctx) this.init();
        if (!this.ctx || this.engineNode) return;
        let bufferSize = this.ctx.sampleRate * 2.0;
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        this.engineNode = this.ctx.createBufferSource();
        this.engineNode.buffer = buffer;
        this.engineNode.loop = true;
        let filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400; // Deep rumble
        this.engineGain = this.ctx.createGain();
        this.engineGain.gain.value = 0;
        this.engineNode.connect(filter);
        filter.connect(this.engineGain);
        this.engineGain.connect(this.effectsGain);
        this.engineNode.start();
    },

    updateEngine: function (thrustAmount) {
        if (!this.engineGain) return;
        // Directly set value to prevent timeline memory leak from thousands of events
        this.engineGain.gain.value = thrustAmount * 0.3;
    },

    stopEngine: function () {
        if (this.engineNode) {
            this.engineNode.stop();
            this.engineNode.disconnect();
            this.engineGain.disconnect();
            this.engineNode = null;
            this.engineGain = null;
        }
    },

    playGlitch: function () {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        let bufferSize = this.ctx.sampleRate * 0.3;
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        let noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        let filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(2000, this.ctx.currentTime);
        let gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.effectsGain);
        noise.start();
    },

    playSafeLand: function () {
        if (!this.ctx) this.init();
        if (!this.ctx) return;
        this.playBlip(440, 'sine', 0.2);
        setTimeout(() => this.playBlip(554, 'sine', 0.3), 100);
        setTimeout(() => this.playBlip(659, 'sine', 0.4), 200);
    }
};

// Start audio context on first interaction
window.addEventListener('keydown', () => {
    if (!AudioSystem.ctx) AudioSystem.init();
}, { once: true });
window.addEventListener('mousedown', () => {
    if (!AudioSystem.ctx) AudioSystem.init();
}, { once: true });

    <script>
const MusicSystem = {
    ctx: null,
    musicGain: null,
    enabled: true,
    
    bpm: 110,
    currentStep: 0,
    nextNoteTime: 0,
    lookahead: 25.0, // ms
    scheduleAheadTime: 0.1, // s
    timerID: null,
    
    state: 'menu', // menu, playing, intense, death, victory
    
    // Scale: C Minor (C, D, Eb, F, G, Ab, Bb)
    scale: [0, 2, 3, 5, 7, 8, 10], 
    rootFreq: 130.81, // C3
    
    init: function(audioCtx) {
        if (!this.enabled) return;
        this.ctx = audioCtx;
        this.musicGain = this.ctx.createGain();
        this.updateVolume();
        
        if (typeof AudioSystem !== 'undefined' && AudioSystem.masterGain) {
            this.musicGain.connect(AudioSystem.masterGain);
        } else {
            this.musicGain.connect(this.ctx.destination);
        }
    },

    updateVolume: function() {
        if (this.musicGain && typeof saveData !== 'undefined') {
            // Default music volume to 0.5 if undefined
            if (saveData.musicVolume === undefined) saveData.musicVolume = 0.5;
            this.musicGain.gain.value = saveData.musicVolume * 0.7; // Lowered by 30% globally
        }
    },

    start: function() {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume(); // Ensure context is running
        if (this.timerID) return;
        this.currentStep = 0;
        this.nextNoteTime = this.ctx.currentTime + 0.1;
        this.scheduler();
    },

    stop: function() {
        if (this.timerID) {
            clearTimeout(this.timerID);
            this.timerID = null;
        }
    },

    setState: function(newState) {
        if (this.state === newState) return;
        this.state = newState;
        
        if (!this.ctx) return;

        // Immediate stingers
        try {
            let t = this.ctx.currentTime + 0.05;
            if (newState === 'lost') {
                this.playChord([0, 1, 6], 0.1, 1.5, 0.15, t, 'sawtooth'); // Dissonant crash (very low volume)
            } else if (newState === 'victory' || newState === 'won') {
                this.playChord([0, 4, 7, 12], 0.5, 3.0, 0.8, t, 'sine'); // C Major triumph
            }
        } catch (e) {
            console.warn("MusicSystem stinger error:", e);
        }
    },

    getFreq: function(degree, octaveOffset = 0) {
        let noteIndex = degree % this.scale.length;
        let octave = Math.floor(degree / this.scale.length) + octaveOffset;
        if (noteIndex < 0) {
            noteIndex += this.scale.length;
            octave -= 1;
        }
        let semitones = this.scale[noteIndex] + (octave * 12);
        return this.rootFreq * Math.pow(2, semitones / 12);
    },

    getIntensityLevel: function() {
        if (typeof currentLevel !== 'undefined' && currentLevel && currentLevel.isTutorial) return -1;
        if (typeof currentLevelIndex === 'undefined') return 0;
        return currentLevelIndex;
    },

    scheduler: function() {
        while (this.nextNoteTime < this.ctx.currentTime + this.scheduleAheadTime) {
            this.scheduleNote(this.currentStep, this.nextNoteTime);
            this.nextNote();
        }
        this.timerID = setTimeout(() => this.scheduler(), this.lookahead);
    },

    nextNote: function() {
        const secondsPerBeat = 60.0 / this.bpm;
        this.nextNoteTime += 0.25 * secondsPerBeat; // 16th notes
        this.currentStep = (this.currentStep + 1) % 16;
    },

    scheduleNote: function(step, time) {
        if (this.state === 'lost' || this.state === 'victory' || this.state === 'won') {
            // Stop regular beat on lost/victory, just let the ambient chords play if any
            if ((this.state === 'victory' || this.state === 'won') && step === 0) {
                this.playChord([0, 4, 7], 2, 4.0, 0.4, time, 'triangle');
            }
            return;
        }

        let iLvl = this.getIntensityLevel();

        // Tutorial Track (iLvl < 0)
        if (iLvl < 0 && this.state === 'playing') {
            // Training simulation vibe: very sparse, slow pulse
            if (step % 8 === 0) {
                this.playKick(time);
            }
            if (step === 0) {
                let chord = [0, 4, 7]; // C Major
                this.playChord(chord, 1.0, 3.0, 0.4, time, 'sine');
            }
            return; // Skip the rest of the normal gameplay track
        }

        // Drums (only during gameplay)
        if (this.state === 'playing' || this.state === 'intense') {
            let beatVol = (iLvl >= 0 && iLvl < 10) ? 0.7 : 1.0; // Reduce beats by 30% in opening levels
            
            // Kick on 0, 4, 8, 12
            if (step % 4 === 0) {
                this.playKick(time, beatVol);
            }
            
            // Hihats scale with level intensity up to 23
            if (iLvl >= 10 || this.state === 'intense') {
                if (step % 4 === 2) this.playHat(time, 0.05 * beatVol); // offbeat hats (quieter)
            }
        }

        // Bassline (only during gameplay)
        if (this.state === 'playing' || this.state === 'intense') {
            let bassPattern = [0, 0, 0, 0,  2, 2, 2, 2,  4, 4, 4, 4,  -1, -1, 0, 0];
            let note = bassPattern[Math.floor(step / 2)];
            
            if (iLvl < 10 && this.state !== 'intense') {
                // Sparse bass
                if (step % 8 === 0) this.playBass(note, time, 0.4);
            } else {
                // Standard 8th note bass
                if (step % 2 === 0) this.playBass(note, time, 0.4);
            }
        }

        // Beautiful Synth Melody (Level 21+)
        if (this.state === 'playing' && iLvl >= 20 || this.state === 'intense') {
            // A catchy, triumphant 16-step melody pattern
            let melody = [7, -1, 9, -1, 4, -1, -1, 2, 4, -1, 7, -1, 0, -1, 2, -1];
            if (melody[step] !== -1) {
                this.playNiceMelody(melody[step], time);
            }
        }

        // Ambient Chords (Every bar/16 steps)
        if (step === 0) {
            // 8-bar progression to reduce repetitiveness
            let chordProg = [
                [0, 2, 4],    // Cm
                [4, 6, 8],    // Gm
                [3, 5, 7],    // F
                [-1, 1, 3],   // Bb
                [0, 2, 4],    // Cm
                [4, 6, 8],    // Gm
                [5, 7, 9],    // Ab
                [7, 10, 14]   // Gmaj
            ];
            // Advance chord every bar based on time
            let bar = Math.floor(time * (this.bpm / 60) / 4) % 8;
            let chord = chordProg[bar];
            
            if (this.state === 'menu') {
                this.playChord(chord, 1.0, 6.0, 0.6, time, 'sine');
            } else if (this.state === 'playing' || this.state === 'intense') {
                this.playChord(chord, 1.0, 2.0, 0.4, time, 'triangle');
            }
        }
    },

    playKick: function(time, volScale = 1.0) {
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.musicGain);

        osc.frequency.setValueAtTime(150, time);
        osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);

        gain.gain.setValueAtTime(0.8 * volScale, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);

        osc.start(time);
        osc.stop(time + 0.5);
    },

    playHat: function(time, vol = 0.2) {
        let bufferSize = this.ctx.sampleRate * 0.1;
        let buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        let data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        
        let noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        let filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 5000;

        let gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.musicGain);

        noise.start(time);
    },

    playBass: function(degree, time, volScale=1.0) {
        let freq = this.getFreq(degree, -1);
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        let filter = this.ctx.createBiquadFilter();

        osc.type = 'sawtooth';
        osc.frequency.value = freq;
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(500, time);
        filter.frequency.exponentialRampToValueAtTime(100, time + 0.2);

        gain.gain.setValueAtTime(0.5 * volScale, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.musicGain);

        osc.start(time);
        osc.stop(time + 0.2);
    },

    playNiceMelody: function(degree, time) {
        let freq = this.getFreq(degree, 1);
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        let filter = this.ctx.createBiquadFilter();
        
        // A nice, bright square wave with a filter sweep
        osc.type = 'square';
        osc.frequency.value = freq;
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2000, time);
        filter.frequency.exponentialRampToValueAtTime(300, time + 0.15);
        
        gain.gain.setValueAtTime(0.02, time); // Quieter melody
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.musicGain);

        osc.start(time);
        osc.stop(time + 0.2);
    },

    playLead: function(degree, time) {
        let freq = this.getFreq(degree, 1);
        let osc = this.ctx.createOscillator();
        let gain = this.ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = freq;
        
        // Slow attack and decay for a sweeping pad/lead sound
        gain.gain.setValueAtTime(0.01, time);
        gain.gain.linearRampToValueAtTime(0.3, time + 0.5);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 2.0);

        osc.connect(gain);
        gain.connect(this.musicGain);

        osc.start(time);
        osc.stop(time + 2.0);
    },

    playChord: function(degrees, attack, decay, vol, time, type='triangle') {
        try {
            let t = time;
            if (t <= this.ctx.currentTime) t = this.ctx.currentTime + 0.01;
            
            degrees.forEach(degree => {
                let freq = this.getFreq(degree, 0);
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.value = freq;
                
                gain.gain.setValueAtTime(0.01, t);
                gain.gain.linearRampToValueAtTime(vol / degrees.length, t + attack);
                gain.gain.exponentialRampToValueAtTime(0.01, t + attack + decay);

                osc.connect(gain);
                gain.connect(this.musicGain);

                osc.start(t);
                osc.stop(t + attack + decay);
            });
        } catch (e) {
            console.warn("MusicSystem playChord error:", e);
        }
    }
};

    generateSecurePlayerId(username) {
        // A simple obfuscation: salt + caesar cipher + base64
        const salt = "retr0_";
        let str = salt + username + "_" + Date.now();
        let shifted = "";
        for (let i = 0; i < str.length; i++) {
            shifted += String.fromCharCode(str.charCodeAt(i) + 5);
        }
        return btoa(shifted);
    }

    async enqueue(action, data) {
        this.queue.push({ action, data });
        this.processQueue();
    }

    async processQueue() {
        if (this.isProcessing || this.queue.length === 0) return;
        this.isProcessing = true;

        while (this.queue.length > 0) {
            const req = this.queue.shift();
            try {
                if (req.action === 'submitRun') {
                    await this.sendPost(req.data);
                } else if (req.action === 'updateProfile') {
                    await this.sendPost(req.data);
                } else if (req.action === 'deleteProfile') {
                    await this.sendPost({ type: 'deleteProfile', ...req.data });
                }
            } catch (err) {
                console.error("Network queue error:", err);
            }
            // slight delay to not bomb the server if many queued
            await new Promise(r => setTimeout(r, 1000));
        }

        this.isProcessing = false;
    }

        if (SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_URL_HERE") return;

                headers: {

        if (category === 'IL' && levelIndex !== null) {

let saveData = {
    bestLevels: [],
    bestRTASplits: [],
    bestRTA: null,
    bestIGT: null,
    bestTutorial: null,
    campaignProgress: 0,
    masterVolume: 1.0,
    effectsVolume: 1.0,

    casualRTA: 0,
    casualIGT: 0,
    visualEffects: 'high',
    showTimer: true,
    showFPS: false,
    username: null,
    playerId: null,
    isAnonymous: false
};

let generatedSaveCode = "";
let saveCopyStatus = "";
let loadInput = "";
let loadStatus = "";

function migrateArray(oldArr, oldLen) {
    if (!oldArr) return Array(levels.length).fill(null);
    let len = oldLen !== undefined ? oldLen : oldArr.length;
    
    if (len === 24 && levels.length === 25) {
        let newArr = Array(levels.length).fill(null);
        for (let i = 0; i <= 17; i++) newArr[i] = oldArr[i] !== undefined ? oldArr[i] : null;
        newArr[19] = oldArr[18] !== undefined ? oldArr[18] : null; // Dead Zone
        newArr[20] = oldArr[19] !== undefined ? oldArr[19] : null; // Gearbox
        newArr[21] = oldArr[21] !== undefined ? oldArr[21] : null; // Wormhole (skip 20: Server Core)
        newArr[22] = oldArr[23] !== undefined ? oldArr[23] : null; // Wasteland (skip 22: Vault)
        return newArr;
    }
    
    let newArr = Array(levels.length).fill(null);
    for (let i = 0; i < Math.min(len, levels.length); i++) {
        newArr[i] = oldArr[i] !== undefined ? oldArr[i] : null;
    }
    return newArr;
}

function initSaveSystem() {
    saveData.bestLevels = Array(levels.length).fill(null);
    saveData.bestRTASplits = Array(levels.length).fill(null);
    loadSaveData();
}

function loadSaveData() {
    try {
        let s = localStorage.getItem('retrograde_save');
        if (s) {
            let parsed = JSON.parse(s);
            if (parsed.bestLevels) {
                let needsUpdate = false;
                if (parsed.bestLevels.length !== levels.length) needsUpdate = true;

                saveData.bestLevels = migrateArray(parsed.bestLevels);

                if (parsed.bestRTASplits) {
                    saveData.bestRTASplits = migrateArray(parsed.bestRTASplits);
                }

                if (parsed.bestTutorial !== undefined) {
                    saveData.bestTutorial = parsed.bestTutorial;
                }

                if (parsed.campaignProgress !== undefined) {
                    saveData.campaignProgress = parsed.campaignProgress;
                }

                if (parsed.masterVolume !== undefined) {
                    saveData.masterVolume = parsed.masterVolume;
                }
                if (parsed.effectsVolume !== undefined) {
                    saveData.effectsVolume = parsed.effectsVolume;
                }
                if (parsed.musicVolume !== undefined) {
                    saveData.musicVolume = parsed.musicVolume;
                }

                if (parsed.casualRTA !== undefined) {
                    saveData.casualRTA = parsed.casualRTA;
                }

                if (parsed.casualIGT !== undefined) {
                    saveData.casualIGT = parsed.casualIGT;
                }

                if (parsed.visualEffects !== undefined) {
                    saveData.visualEffects = parsed.visualEffects;
                }

                if (parsed.showTimer !== undefined) {
                    saveData.showTimer = parsed.showTimer;
                }

                if (parsed.showFPS !== undefined) {
                    saveData.showFPS = parsed.showFPS;
                }

                if (parsed.username !== undefined) {
                    saveData.username = parsed.username;
                }

                if (parsed.playerId !== undefined) {
                    saveData.playerId = parsed.playerId;
                }

                if (parsed.isAnonymous !== undefined) {
                    saveData.isAnonymous = parsed.isAnonymous;
                }

                if (parsed.bestLevels.length === levels.length) {
                    if (parsed.bestRTA !== undefined) saveData.bestRTA = parsed.bestRTA;
                    if (parsed.bestIGT !== undefined) saveData.bestIGT = parsed.bestIGT;
                } else {
                    saveData.bestRTA = null;
                    saveData.bestIGT = null;
                    needsUpdate = true;
                }

                if (parsed.bestLevels.length !== levels.length) {
                    needsUpdate = true;
                }

                if (needsUpdate) {
                    storeSaveData();
                }
            }
        }
        if (saveData.username || saveData.isAnonymous) {
            if (typeof menuScreen !== 'undefined' && menuScreen === 'startup') {
                menuScreen = 'main';
            }
        }
        
        MAX_PARTICLES = saveData.visualEffects === 'high' ? 800 : (saveData.visualEffects === 'medium' ? 400 : 200);
    } catch (e) { console.error("Save load failed", e); }
}

let _saveScheduled = false;

function storeSaveData() {
    if (_saveScheduled) return;
    _saveScheduled = true;
    // Batch all saves within the same frame into a single write
    queueMicrotask(() => {
        _saveScheduled = false;
        try {
            localStorage.setItem('retrograde_save', JSON.stringify(saveData));
        } catch (e) { console.error("Save store failed", e); }
    });
}

// Force an immediate synchronous save (use sparingly — only on page unload)
function storeSaveDataImmediate() {
    try {
        localStorage.setItem('retrograde_save', JSON.stringify(saveData));
    } catch (e) { console.error("Save store failed", e); }
}

// --- ENCODE/DECODE PASSWORD ALGORITHM ---
function generateSaveCode() {
    let sumOfBests = 0;
    let hasAll = true;
    for (let i = 0; i < levels.length; i++) {
        if (saveData.bestLevels[i] === null) hasAll = false;
        else sumOfBests += saveData.bestLevels[i];
    }
    let sobToSave = hasAll ? sumOfBests : null;

    let dataArr = [...saveData.bestLevels, saveData.bestRTA, saveData.bestIGT, sobToSave];
    let sum = 0;

    let strArr = dataArr.map(val => {
        if (val === null) return "N";
        let formatted = val.toFixed(3);
        sum += parseFloat(formatted); // FIX: Accumulate the exact rounded value being saved
        return formatted;
    });

    let checksum = sum * 7;
    strArr.push(checksum.toFixed(3));

    let tutStr = saveData.bestTutorial === null ? "TN" : "T" + saveData.bestTutorial.toFixed(3);
    strArr.splice(strArr.length - 1, 0, tutStr);

    let rawStr = strArr.join(',');

    let shiftedStr = "";
    for (let i = 0; i < rawStr.length; i++) {
        shiftedStr += String.fromCharCode(rawStr.charCodeAt(i) + 3);
    }

    return btoa(shiftedStr);
}

function parseSaveCode(code) {
    try {
        let shiftedStr = atob(code);
        let rawStr = "";
        for (let i = 0; i < shiftedStr.length; i++) {
            rawStr += String.fromCharCode(shiftedStr.charCodeAt(i) - 3);
        }

        let parts = rawStr.split(',');
        if (parts.length < 14) return false;

        let parsedVals = [];
        let sum = 0;
        let parsedTutorial = null;

        for (let i = 0; i < parts.length - 1; i++) {
            if (typeof parts[i] === 'string' && parts[i].startsWith('T')) {
                let valStr = parts[i].substring(1);
                if (valStr !== 'N') {
                    parsedTutorial = parseFloat(valStr);
                    if (isNaN(parsedTutorial)) return false;
                }
            } else if (parts[i] === "N") {
                parsedVals.push(null);
            } else {
                let val = parseFloat(parts[i]);
                if (isNaN(val)) return false;
                parsedVals.push(val);
                sum += val;
            }
        }

        let checksum = parseFloat(parts[parts.length - 1]);
        if (Math.abs(checksum - (sum * 7)) > 0.1) return false;

        let numLevelsInSave = parsedVals.length - 3;

        saveData.bestLevels = migrateArray(parsedVals, numLevelsInSave);

        saveData.bestTutorial = parsedTutorial;

        if (numLevelsInSave === levels.length) {
            saveData.bestRTA = parsedVals[numLevelsInSave];
            saveData.bestIGT = parsedVals[numLevelsInSave + 1];
        } else {
            saveData.bestRTA = null;
            saveData.bestIGT = null;
        }

        storeSaveData();
        return true;
    } catch (e) {
        return false;
    }
}

    <script>
let isMouseDown = false;
window.addEventListener('mousedown', () => { isMouseDown = true; });
window.addEventListener('mouseup', () => {
    if (isMouseDown && typeof state !== 'undefined' && state === 'menu' && typeof menuScreen !== 'undefined' && menuScreen === 'settings') {
        if (typeof storeSaveData !== 'undefined') storeSaveData();
    }
    isMouseDown = false;
});

window.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mouseX = (e.clientX - rect.left) * scaleX;
    mouseY = (e.clientY - rect.top) * scaleY;

    if (isMouseDown && typeof state !== 'undefined' && state === 'menu' && typeof menuScreen !== 'undefined' && menuScreen === 'settings') {
        let toggle4Y = 360;
        let toggle5Y = 420;
        let toggle6Y = 480;

        if (mouseX > canvas.width / 2 - 250 && mouseX < canvas.width / 2 + 250) {
            let clickedVal = (mouseX - (canvas.width / 2 - 250)) / 500;
            clickedVal = Math.max(0, Math.min(1, clickedVal));

            if (mouseY > toggle4Y && mouseY < toggle4Y + 50) {
                saveData.masterVolume = clickedVal;
                if (typeof AudioSystem !== 'undefined') AudioSystem.updateVolumes();
            }

            if (mouseY > toggle5Y && mouseY < toggle5Y + 50) {
                saveData.effectsVolume = clickedVal;
                if (typeof AudioSystem !== 'undefined') AudioSystem.updateVolumes();
            }

            if (mouseY > toggle6Y && mouseY < toggle6Y + 50) {
                saveData.musicVolume = clickedVal;
            }
        }
    }
});

window.addEventListener('click', e => {
    if (state === 'menu') {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const cx = (e.clientX - rect.left) * scaleX;
        const cy = (e.clientY - rect.top) * scaleY;



        let clickedBtn = null;
        if (typeof activeUIButtons !== 'undefined') {
            for (let b of activeUIButtons) {
                if (cx >= b.x && cx <= b.x + b.w && cy >= b.y && cy <= b.y + b.h) {
                    clickedBtn = b;
                    break;
                }
            }
        }

        if (clickedBtn) {
            let id = clickedBtn.id;
            
            if (id === 'play') {
                isPracticeMode = false;
                currentLevelIndex = 0;
                saveData.campaignProgress = 0;
                saveData.casualRTA = 0;
                saveData.casualIGT = 0;
                runInvalidated = false;
                runState = 'inactive';
                currentRunRTA = 0;
                currentRunIGT = 0;
                hasMoved = false;
                storeSaveData();
                loadLevel(currentLevelIndex);
            } else if (id === 'continue') {
                let isContinueDisabled = isSpeedrunMode || saveData.campaignProgress === 0;
                if (!isContinueDisabled) {
                    isPracticeMode = false;
                    currentLevelIndex = saveData.campaignProgress;
                    if (currentLevelIndex >= levels.length) currentLevelIndex = 0;
                    runInvalidated = true;
                    runState = 'active';
                    currentRunRTA = saveData.casualRTA || 0;
                    currentRunIGT = saveData.casualIGT || 0;
                    hasMoved = false;
                    loadLevel(currentLevelIndex);
                }
            } else if (id === 'practice') {
                menuScreen = 'practice';
                practicePage = 0;
            } else if (id === 'tutorial') {
                isPracticeMode = false;
                loadLevel(-1);
            } else if (id === 'times') {
                menuScreen = 'times';
                timesPage = 0;
            } else if (id === 'saveload') {
                menuScreen = 'saveload';
                saveCopyStatus = "";
                generatedSaveCode = generateSaveCode();
                loadInput = "";
                loadStatus = "";
            } else if (id === 'profile') {
                menuScreen = 'profile';
                profileInput = "";
                profileStatus = "";
            } else if (id === 'update_profile') {
                if (typeof profileInput !== 'undefined' && profileInput.trim().length > 0) {
                    saveData.username = profileInput.trim();
                    if (saveData.isAnonymous) {
                        saveData.playerId = db.generateSecurePlayerId(saveData.username);
                        saveData.isAnonymous = false;
                    }
                    storeSaveData();
                    if (typeof db !== 'undefined') db.updateProfile(saveData.username, saveData.playerId);
                    profileStatus = "SUCCESS! PROFILE UPDATED.";
                    profileInput = "";
                } else {
                    profileStatus = "ERROR: NAME CANNOT BE EMPTY";
                }
            } else if (id === 'settings') {
                menuScreen = 'settings';
            } else if (id === 'back_settings' || id === 'back_saveload' || id === 'back_profile') {
                menuScreen = 'main';
            } else if (id === 'startup_anon') {
                saveData.isAnonymous = true;
                storeSaveData();
                menuScreen = 'main';
            } else if (id === 'startup_create_btn') {
                startupState = 'create';
                startupStatus = "";
                startupCreateInput = "";
            } else if (id === 'startup_login_btn') {
                startupState = 'login';
                startupStatus = "";
                startupLoginUser = "";
                startupLoginId = "";
                startupLoginFocus = 'username';
            } else if (id === 'startup_back') {
                startupState = 'menu';
                startupStatus = "";
            } else if (id === 'startup_focus_username') {
                startupLoginFocus = 'username';
            } else if (id === 'startup_focus_id') {
                startupLoginFocus = 'id';
            } else if (id === 'startup_create_submit') {
                if (typeof startupCreateInput !== 'undefined' && startupCreateInput.trim().length > 0) {
                    startupStatus = "CHECKING USERNAME...";
                    let newName = startupCreateInput.trim().substring(0, 20);
                    if (typeof db !== 'undefined') {
                        db.checkUsername(newName).then(res => {
                            if (res.error) {
                                startupStatus = "ERROR: " + res.error;
                            } else if (!res.available) {
                                startupStatus = "ERROR: USERNAME TAKEN";
                            } else {
                                saveData.username = newName;
                                saveData.playerId = db.generateSecurePlayerId(saveData.username);
                                saveData.isAnonymous = false;
                                storeSaveData();
                                menuScreen = 'main';
                                startupStatus = "";
                            }
                        }).catch(err => {
                            startupStatus = "ERROR: NETWORK ERROR";
                        });
                    }
                } else {
                    startupStatus = "ERROR: NAME CANNOT BE EMPTY";
                }
            } else if (id === 'startup_login_submit') {
                if (typeof startupLoginUser !== 'undefined' && startupLoginUser.trim().length > 0 && typeof startupLoginId !== 'undefined' && startupLoginId.trim().length > 9) {
                    startupStatus = "LOADING...";
                    if (typeof db !== 'undefined') {
                        db.fetchProfile(startupLoginId.trim()).then(res => {
                            if (res.error) {
                                startupStatus = "ERROR: " + res.error;
                            } else if (res.username !== startupLoginUser.trim()) {
                                startupStatus = "ERROR: INCORRECT USERNAME";
                            } else {
                                saveData.isAnonymous = false;
                                saveData.playerId = startupLoginId.trim();
                                saveData.username = res.username;
                                saveData.bestLevels = res.bestLevels || new Array(25).fill(null);
                                saveData.bestRTA = res.bestRTA;
                                saveData.bestIGT = res.bestIGT;
                                saveData.casualRTA = res.casualRTA;
                                saveData.casualIGT = res.casualIGT;
                                saveData.campaignProgress = res.campaignProgress || 1;
                                storeSaveData();
                                menuScreen = 'main';
                                startupStatus = "";
                            }
                        }).catch(err => {
                            startupStatus = "ERROR: FETCH FAILED";
                        });
                    }
                } else {
                    startupStatus = "ERROR: FILL ALL FIELDS";
                }
            } else if (id === 'logout_profile') {
                saveData = {
                    campaignProgress: 1,
                    isAnonymous: true,
                    playerId: null,
                    username: null,
                    masterVolume: 0.5,
                    effectsVolume: 0.5,
                    musicVolume: 0.5,
                    showTimer: true,
                    showFPS: false,
                    visualEffects: 'high',
                    bestLevels: new Array(25).fill(null),
                    bestRTA: null,
                    bestIGT: null,
                    casualRTA: null,
                    casualIGT: null
                };
                storeSaveData();
                menuScreen = 'startup';
                startupInput = "";
                startupStatus = "";
            } else if (id === 'speedrun_mode') {
                isSpeedrunMode = !isSpeedrunMode;
                if (!isSpeedrunMode) {
                    runInvalidated = true;
                } else {
                    cheatsEnabled = false;
                    customFinalLevel = null;
                    activeCheatPrefix = null;
                    cheatPrefixTimer = 0;
                }
            } else if (id === 'visual_effects') {
                if (saveData.visualEffects === 'high') saveData.visualEffects = 'medium';
                else if (saveData.visualEffects === 'medium') saveData.visualEffects = 'low';
                else saveData.visualEffects = 'high';
                
                if (saveData.visualEffects === 'high') MAX_PARTICLES = 800;
                else if (saveData.visualEffects === 'medium') MAX_PARTICLES = 400;
                else MAX_PARTICLES = 200;
                particles = Array.from({ length: MAX_PARTICLES }, () => ({
                    active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, type: 'exhaust'
                }));
                particleIndex = 0;
                storeSaveData();
            } else if (id === 'show_timer') {
                saveData.showTimer = !saveData.showTimer;
                storeSaveData();
            } else if (id === 'show_fps') {
                saveData.showFPS = !saveData.showFPS;
                storeSaveData();
            } else if (id === 'terminal_speedrun') {
                allowTerminalInSpeedrun = !allowTerminalInSpeedrun;
            } else if (id === 'test_server') {
                if (serverTestStatus !== 'TESTING...') {
                    serverTestStatus = 'TESTING...';
                    if (typeof db !== 'undefined') {
                        db.testConnection().then(res => {
                            serverTestStatus = res;
                        }).catch(() => {
                            serverTestStatus = 'ERROR';
                        });
                    } else {
                        serverTestStatus = 'OFFLINE';
                    }
                }
            } else if (id === 'copy_save') {
                navigator.clipboard.writeText(generatedSaveCode).catch(err => {
                    let textArea = document.createElement("textarea");
                    textArea.value = generatedSaveCode;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("Copy");
                    textArea.remove();
                });
                saveCopyStatus = "COPIED TO CLIPBOARD!";
            } else if (id === 'copy_player_id') {
                navigator.clipboard.writeText(saveData.playerId).catch(err => {
                    let textArea = document.createElement("textarea");
                    textArea.value = saveData.playerId;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand("Copy");
                    textArea.remove();
                });
                profileStatus = "ID COPIED TO CLIPBOARD!";
            } else if (clickedBtn.isSlider) {
                let clickedVal = (cx - clickedBtn.x) / clickedBtn.w;
                clickedVal = Math.max(0, Math.min(1, clickedVal));
                
                if (id === 'master_volume') {
                    saveData.masterVolume = clickedVal;
                    if (typeof AudioSystem !== 'undefined') AudioSystem.updateVolumes();
                    storeSaveData();
                } else if (id === 'effects_volume') {
                    saveData.effectsVolume = clickedVal;
                    if (typeof AudioSystem !== 'undefined') AudioSystem.updateVolumes();
                    storeSaveData();
                } else if (id === 'music_volume') {
                    saveData.musicVolume = clickedVal;
                    if (typeof AudioSystem !== 'undefined') AudioSystem.updateVolumes();
                    storeSaveData();
                }
            } else if (id.startsWith('practice_level_')) {
                let actualIndex = parseInt(id.split('_')[2], 10);
                isPracticeMode = true;
                currentLevelIndex = actualIndex;
                loadLevel(currentLevelIndex);
            } else if (id === 'practice_prev') {
                practicePage--;
            } else if (id === 'practice_next') {
                practicePage++;
            } else if (id.startsWith('times_tab_')) {
                timesTab = parseInt(id.split('_')[2], 10);
                if (timesTab === 1) {
                    if (typeof db !== 'undefined') db.fetchLeaderboard(lbCategory);
                }
                if (timesTab === 2) {
                    if (typeof db !== 'undefined') db.fetchLeaderboard('IL', lbLevel);
                }
            } else if (id === 'times_prev') {
                timesPage--;
            } else if (id === 'times_next') {
                timesPage++;
            } else if (id === 'times_category') {
                lbCategory = lbCategory === 'Speedrun' ? 'Casual' : 'Speedrun';
                if (typeof db !== 'undefined') db.fetchLeaderboard(lbCategory);
            } else if (id === 'times_easter_egg') {
                let now = Date.now();
                individualClicks.push(now);
                individualClicks = individualClicks.filter(t => now - t <= 3000);
                if (individualClicks.length >= 3) {
                    showTutorialTime = true;
                    individualClicks = [];
                }
            } else if (id === 'back_practice' || id === 'back_times') {
                menuScreen = 'main';
                showTutorialTime = false;
            }
            
            return;
        } else if (menuScreen === 'settings' && !clickedBtn) {
            let sLeft = canvas.width / 2 - 140;
            let sRight = canvas.width / 2 + 140;
            if (cx > sLeft && cx < sRight && cy > 90 && cy < 150) {
                let now = Date.now();
                if (now - lastSettingsClickTime > 1000) settingsHeaderClickCount = 0;
                settingsHeaderClickCount++;
                lastSettingsClickTime = now;
                if (settingsHeaderClickCount >= 4) {
                    easterEggUnlocked = true;
                }
            }
        }
    }
});

            loadInput += text.trim();
            loadStatus = "";

        let text = (e.clipboardData || window.clipboardData).getData('text');
        if (text) {
            profileInput += text.trim();
            profileStatus = "";
        }
    } else if (state === 'menu' && menuScreen === 'startup') {
        let text = (e.clipboardData || window.clipboardData).getData('text');
        if (text) {
            if (startupState === 'create') {
                startupCreateInput = (typeof startupCreateInput !== 'undefined' ? startupCreateInput : "") + text.trim();
            } else if (startupState === 'login') {
                if (startupLoginFocus === 'username') {
                    startupLoginUser = (typeof startupLoginUser !== 'undefined' ? startupLoginUser : "") + text.trim();
                } else {
                    startupLoginId = (typeof startupLoginId !== 'undefined' ? startupLoginId : "") + text.trim();
                }
            }
            startupStatus = "";
        }
    }
});

window.addEventListener('blur', () => {
    if (state !== 'menu') {
        isPaused = true;
    }
    keys = {};
    tHoldTimer = 0;
    tTriggeredReset = false;
});

window.addEventListener('keydown', e => {
    if (state === 'menu') {
        if (menuScreen === 'saveload') {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') return;
            e.preventDefault();
            if (e.key === 'Escape') {
                menuScreen = 'main';
            } else if (e.key === 'Enter') {
                let success = parseSaveCode(loadInput);
                if (success) {
                    loadStatus = "SUCCESS! DATA LOADED.";
                } else {
                    loadStatus = "CORRUPTED DATA.";
                }
            } else if (e.key === 'Backspace') {
                loadInput = loadInput.slice(0, -1);
                loadStatus = "";
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                loadInput += e.key;
                loadStatus = "";
            }
            return;
        } else if (menuScreen === 'profile') {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') return;
            e.preventDefault();
            if (e.key === 'Escape') {
                menuScreen = 'main';
            } else if (e.key === 'Enter') {
                if (typeof profileInput !== 'undefined' && profileInput.trim().length > 0) {
                    let newName = profileInput.trim().substring(0, 20);
                    if (saveData.username === newName) {
                        profileStatus = "SUCCESS! PROFILE UPDATED.";
                        profileInput = "";
                        return;
                    }
                    
                    profileStatus = "CHECKING USERNAME...";
                    if (typeof db !== 'undefined') {
                        db.checkUsername(newName).then(res => {
                            if (res.error) {
                                profileStatus = "ERROR: " + res.error;
                            } else if (!res.available) {
                                profileStatus = "ERROR: USERNAME TAKEN";
                            } else {
                                saveData.username = newName;
                                if (saveData.isAnonymous) {
                                    saveData.playerId = db.generateSecurePlayerId(saveData.username);
                                    saveData.isAnonymous = false;
                                }
                                storeSaveData();
                                db.updateProfile(saveData.username, saveData.playerId);
                                profileStatus = "SUCCESS! PROFILE UPDATED.";
                                profileInput = "";
                            }
                        }).catch(err => {
                            profileStatus = "ERROR: NETWORK ERROR";
                        });
                    }
                } else {
                    profileStatus = "ERROR: NAME CANNOT BE EMPTY";

// --- UNIFORM SPATIAL HASH GRID ---
// Accelerates broad-phase collision by partitioning space into fixed-size cells.
// Each cell stores references to obstacles whose AABBs overlap it.

const SpatialGrid = {
    cellSize: 200,
    cols: 0,
    rows: 0,
    cells: null,          // flat array of arrays, indexed by (row * cols + col)
    staticCells: null,    // snapshot of static-only obstacle lists per cell
    dynamicIndices: [],   // indices of obstacles that are moving/rotating

    build(obstacles, levelWidth, levelHeight) {
        this.cellSize = 200;
        this.cols = Math.ceil(levelWidth / this.cellSize) + 1;
        this.rows = Math.ceil(levelHeight / this.cellSize) + 1;

        const totalCells = this.cols * this.rows;

        // Allocate cell arrays
        this.cells = new Array(totalCells);
        this.staticCells = new Array(totalCells);
        for (let i = 0; i < totalCells; i++) {
            this.cells[i] = [];
            this.staticCells[i] = [];
        }

        this.dynamicIndices = [];

        for (let oi = 0; oi < obstacles.length; oi++) {
            const obs = obstacles[oi];
            const isDynamic = obs.isMoving || obs.isRotating;

            if (isDynamic) {
                this.dynamicIndices.push(oi);
            }

            // Insert into all cells overlapping the AABB
            this._insertObs(obs, isDynamic);
        }

        // Snapshot static cells
        for (let i = 0; i < totalCells; i++) {
            this.staticCells[i] = this.cells[i].slice();
        }
    },

    _insertObs(obs, isDynamic) {
        const aabb = obs.aabb;
        const minCol = Math.max(0, Math.floor(aabb.minX / this.cellSize));
        const maxCol = Math.min(this.cols - 1, Math.floor(aabb.maxX / this.cellSize));
        const minRow = Math.max(0, Math.floor(aabb.minY / this.cellSize));
        const maxRow = Math.min(this.rows - 1, Math.floor(aabb.maxY / this.cellSize));

        for (let r = minRow; r <= maxRow; r++) {
            for (let c = minCol; c <= maxCol; c++) {
                this.cells[r * this.cols + c].push(obs);
            }
        }
    },

    // Call each frame after updating moving/rotating obstacle positions & AABBs
    updateDynamic(obstacles) {
        if (this.dynamicIndices.length === 0) return;

        const totalCells = this.cols * this.rows;

        // Reset cells to static-only snapshot
        for (let i = 0; i < totalCells; i++) {
            const st = this.staticCells[i];
            const cell = this.cells[i];
            cell.length = st.length;
            for (let j = 0; j < st.length; j++) {
                cell[j] = st[j];
            }
        }

        // Re-insert dynamic obstacles with updated AABBs
        for (let i = 0; i < this.dynamicIndices.length; i++) {
            const obs = obstacles[this.dynamicIndices[i]];
            this._insertObs(obs, true);
        }
    },

    // Get obstacles in the cell containing point (x, y)
    query(x, y) {
        const col = Math.floor(x / this.cellSize);
        const row = Math.floor(y / this.cellSize);
        if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return _emptyArr;
        return this.cells[row * this.cols + col];
    },

    // Get deduplicated obstacles overlapping a rectangular region
    queryRect(minX, minY, maxX, maxY) {
        const minCol = Math.max(0, Math.floor(minX / this.cellSize));
        const maxCol = Math.min(this.cols - 1, Math.floor(maxX / this.cellSize));
        const minRow = Math.max(0, Math.floor(minY / this.cellSize));
        const maxRow = Math.min(this.rows - 1, Math.floor(maxY / this.cellSize));

        _queryId++;
        _queryResult.length = 0;

        for (let r = minRow; r <= maxRow; r++) {
            for (let c = minCol; c <= maxCol; c++) {
                const cell = this.cells[r * this.cols + c];
                for (let i = 0; i < cell.length; i++) {
                    const obs = cell[i];
                    if (obs._queryId !== _queryId) {
                        obs._queryId = _queryId;
                        _queryResult.push(obs);
                    }
                }
            }
        }
        return _queryResult;
    }
};

let _queryId = 0;
const _queryResult = [];

function testCirclePolygon(circle, poly) {
    for (let i = 0; i < poly.normals.length; i++) {
        let axis = poly.normals[i];
        let res = getOverlap(circle, poly, axis);
        if (!res.intersect) return false;
    }

    let closestVertex = null;
    let minSqDist = Infinity;
    for (let i = 0; i < poly.vertices.length; i++) {
        let v = poly.vertices[i];
        let dx = circle.x - v.x;
        let dy = circle.y - v.y;
        let sqDist = dx * dx + dy * dy;
        if (sqDist < minSqDist) {
            minSqDist = sqDist;
            closestVertex = v;
        }
    }

    let axisX = circle.x - closestVertex.x;
    let axisY = circle.y - closestVertex.y;
    let len = Math.sqrt(axisX * axisX + axisY * axisY);
    if (len > 0) {
        let cvAxis = { x: axisX / len, y: axisY / len };
        let res = getOverlap(circle, poly, cvAxis);
        if (!res.intersect) return false;
    }

    return true;
}

function getOverlap(circle, poly, axis) {
    let minP = Infinity, maxP = -Infinity;
    for (let i = 0; i < poly.vertices.length; i++) {
        let proj = poly.vertices[i].x * axis.x + poly.vertices[i].y * axis.y;
        minP = Math.min(minP, proj);
        maxP = Math.max(maxP, proj);
    }
    let cProj = circle.x * axis.x + circle.y * axis.y;
    let minC = cProj - circle.r;
    let maxC = cProj + circle.r;

    if (minP > maxC || minC > maxP) return { intersect: false };
    return { intersect: true };
}

function loadLevel(index) {
    let sourceLevel = index === -1 ? tutorialLevel : levels[index];

    // Targeted shallow clone — only clone mutable arrays, not the entire level tree.
    // Obstacles, theme, and pads are read-only during gameplay.

            vertices = [
                { x: obs.x, y: obs.y },
                { x: obs.x + obs.w, y: obs.y },
                { x: obs.x + obs.w, y: obs.y + obs.h },
                { x: obs.x, y: obs.y + obs.h }

        let normals = [];
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

        for (let i = 0; i < vertices.length; i++) {

            let p2 = vertices[(i + 1) % vertices.length];

            let dy = p2.y - p1.y;

            maxX = Math.max(maxX, p1.x);
            minY = Math.min(minY, p1.y);

            vertices,
            normals,
            aabb: { minX, maxX, minY, maxY }

    if (currentLevel.movingObstacles) {

            let phase = (1 - Math.cos(0 * obs.speed)) / 2;
            let cx = obs.startX + (obs.endX - obs.startX) * phase;
            let cy = obs.startY + (obs.endY - obs.startY) * phase;

            let vertices = [
                { x: cx, y: cy },
                { x: cx + obs.w, y: cy },
                { x: cx + obs.w, y: cy + obs.h },
                { x: cx, y: cy + obs.h }

function spawnExplosion(x, y) {
    if (typeof AudioSystem !== 'undefined') AudioSystem.playExplosion();
    if (typeof screenShake !== 'undefined') screenShake = Math.max(screenShake, 30);
    for (let i = 0; i < 40; i++) {

            p.x = x;

            p.life = 1.0;
            p.type = 'explosion';
        }

}

function spawnSparks(x, y) {
    if (typeof screenShake !== 'undefined') screenShake = Math.max(screenShake, 8);
    for (let i = 0; i < 15; i++) {
        let p = getParticle();
        if (p) {
            p.active = true;
            p.x = x;
            p.y = y;
            p.vx = (Math.random() - 0.5) * 6;
            p.vy = (Math.random() - 0.5) * 6;
            p.life = 0.6;
            p.type = 'spark';
        }
    }
}

function spawnLandingDust(x, y) {
    for (let i = 0; i < 30; i++) {
        let p = getParticle();
        if (p) {
            p.active = true;
            p.x = x + (Math.random() - 0.5) * 30;
            p.y = y + 8 + (Math.random() * 4);
            p.vx = (Math.random() - 0.5) * 6;
            p.vy = -Math.random() * 1 - 0.2;

function getNormalizedAngle() {
    let normAngle = player.angle % (Math.PI * 2);
    if (normAngle > Math.PI) normAngle -= Math.PI * 2;

    <script>

function update(dt) {
    if (isPaused) return;
    if (deltaDisplayTimer > 0) deltaDisplayTimer -= dt / 60;

    if (transitionAlpha > 0) {
        transitionAlpha -= dt * 0.03;
        if (transitionAlpha < 0) transitionAlpha = 0;
    }

    if (cheatPrefixTimer > 0) {
        cheatPrefixTimer -= dt;
        if (cheatPrefixTimer <= 0) activeCheatPrefix = null;
    }

    if (state === 'menu') {
        camera.x += 1 * dt;

        if (!menuShip.active) {
            menuShip.timer -= dt;
            if (menuShip.timer <= 0) {
                menuShip.active = true;
                let fromLeft = Math.random() > 0.5;
                menuShip.direction = fromLeft ? 1 : -1;

                menuShip.x = camera.x + (fromLeft ? -100 : canvas.width + 100);
                menuShip.y = camera.y + 100 + Math.random() * (canvas.height - 200);

                menuShip.vx = menuShip.direction * (Math.random() * 5 + 4);

                if (menuShip.y < camera.y + canvas.height / 2) {
                    menuShip.vy = Math.random() * 2 + 1;
                } else {
                    menuShip.vy = -Math.random() * 4 - 2;
                }

                menuShip.angle = Math.atan2(menuShip.vx, -menuShip.vy);

                menuShip.actionTimer = 0;
                menuShip.timer = Math.random() * 400 + 300;
            }
        } else {
            menuShip.actionTimer -= dt;
            if (menuShip.actionTimer <= 0) {
                let r = Math.random();
                if (r < 0.35) {
                    menuShip.maneuver = 'boost';
                    menuShip.actionTimer = 60 + Math.random() * 80;
                } else if (r < 0.60) {
                    menuShip.maneuver = 'climb';
                    menuShip.actionTimer = 50 + Math.random() * 60;
                } else if (r < 0.80) {
                    menuShip.maneuver = 'dive';
                    menuShip.actionTimer = 50 + Math.random() * 60;
                } else {
                    menuShip.maneuver = 'coast';
                    menuShip.actionTimer = 40 + Math.random() * 60;
                }
            }

            let targetAngle = menuShip.angle;
            menuShip.physicsThrust = 0;
            menuShip.visualThrust = 0;

            if (menuShip.maneuver === 'boost') {
                targetAngle = menuShip.direction * (Math.PI / 2.2);
                menuShip.physicsThrust = Math.random() > 0.3 ? 1.0 : 0.0;
                menuShip.visualThrust = 1.0;
            } else if (menuShip.maneuver === 'climb') {
                targetAngle = menuShip.direction * (Math.PI / 4);
                menuShip.physicsThrust = Math.random() > 0.1 ? 1.0 : 0.0;
                menuShip.visualThrust = 1.0;
            } else if (menuShip.maneuver === 'dive') {
                targetAngle = menuShip.direction * (Math.PI * 0.6);
                menuShip.physicsThrust = Math.random() > 0.5 ? 1.0 : 0.0;
                menuShip.visualThrust = 1.0;
            } else {
                targetAngle = Math.atan2(menuShip.vx, -menuShip.vy);
            }

            let diff = targetAngle - menuShip.angle;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            menuShip.angle += diff * 0.05 * dt;

            if (menuShip.physicsThrust > 0) {
                menuShip.vx += Math.sin(menuShip.angle) * THRUST * 1.2 * dt;
                menuShip.vy -= Math.cos(menuShip.angle) * THRUST * 1.2 * dt;
            }

            menuShip.vy += GRAVITY * dt;
            menuShip.x += menuShip.vx * dt;
            menuShip.y += menuShip.vy * dt;

            if (menuShip.physicsThrust > 0) {
                const count = Math.floor(Math.random() * 2) + 1;
                const baseX = menuShip.x - Math.sin(menuShip.angle) * (menuShip.h / 2);
                const baseY = menuShip.y + Math.cos(menuShip.angle) * (menuShip.h / 2);

                for (let i = 0; i < count; i++) {
                    let p = getParticle();
                    if (p) {
                        p.active = true;
                        p.x = baseX + (Math.random() - 0.5) * 4;
                        p.y = baseY + (Math.random() - 0.5) * 4;
                        p.vx = menuShip.vx * 0.3 + (Math.random() - 0.5) * 2 - Math.sin(menuShip.angle) * 3;
                        p.vy = menuShip.vy * 0.3 + (Math.random() - 0.5) * 2 + Math.cos(menuShip.angle) * 3;
                        p.life = 0.8;
                        p.type = 'exhaust';
                    }
                }
            }

            if (menuShip.x > camera.x + canvas.width + 500 ||
                menuShip.x < camera.x - 500 ||
                menuShip.y > camera.y + canvas.height + 500) {
                menuShip.active = false;

        }

    } else {
        if (keys['escape'] && state !== 'victory') {
            escHoldTimer += dt / 60;
            if (escHoldTimer >= 1.0) {
                goToMenu();
                keys['escape'] = false;

            }
        } else {

        if (keys['t']) {
            if (isSpeedrunMode && !isPracticeMode) {
                tHoldTimer += dt / 60;
                if (tHoldTimer >= 0.5 && !tTriggeredReset) {

                    runState = 'inactive';
                    currentRunRTA = 0;
                    currentRunIGT = 0;
                    rtaSaveTimer = 0;
                    saveData.casualRTA = 0;
                    saveData.casualIGT = 0;
                    saveData.campaignProgress = 0;
                    storeSaveData();

                    currentLevelIndex = 0;
                    runInvalidated = false;
                    loadLevel(0);
                    keys['t'] = false;

        }

        if (state === 'won' || state === 'victory') {

            player.vy = 0;

        }

        if (state === 'playing') {

            if (player.portalCooldown > 0) {

            if (willMove && !hasMoved) {

                if (!isSpeedrunMode) runInvalidated = true;
                if (currentLevelIndex === 0 && !isPracticeMode && !currentLevel.isTutorial && runState === 'inactive') {
                    runState = 'active';
                    currentRunRTA = 0;
                    currentRunIGT = 0;
                }
            }

            // Process Active Area of Effect Zones BEFORE input
            if (activeZones.length > 0) {
                for (let zone of activeZones) {
                    let inside = player.x > zone.x && player.x < zone.x + zone.w &&
                        player.y > zone.y && player.y < zone.y + zone.h;

                    if (inside) {
                        if (zone.type === 'emp') {
                            empActive = true;
                        } else if (zone.type === 'boost') {
                            if (!zone.playerInside) {
                                player.vx *= (zone.multX !== undefined ? zone.multX : 1);
                                player.vy *= (zone.multY !== undefined ? zone.multY : 1);
                                zone.playerInside = true;
                                spawnSparks(player.x, player.y);
                            }
                        } else if (zone.type === 'portal') {
                            if (player.portalCooldown <= 0) {
                                let targetZone = activeZones.find(z => z.id === zone.targetId);
                                if (targetZone) {
                                    spawnSparks(player.x, player.y); // Entry sparks

                                    // --- DIRECTIONAL PORTAL LOGIC ---
                                    let angleA = getFacingAngle(zone.facing || 'up');
                                    let angleB = getFacingAngle(targetZone.facing || 'up');
                                    let rotation = angleB - angleA + Math.PI;

                                    // Rotate visual angle
                                    player.angle += rotation;

                                    // Rotate momentum
                                    let speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
                                    let currentVelAngle = Math.atan2(player.vx, -player.vy);
                                    let newVelAngle = currentVelAngle + rotation;

                                    player.vx = Math.sin(newVelAngle) * speed;
                                    player.vy = -Math.cos(newVelAngle) * speed;

                                    // Teleport with slight offset to avoid getting stuck in the wall
                                    player.x = targetZone.x + targetZone.w / 2 + Math.sin(angleB) * 15;
                                    player.y = targetZone.y + targetZone.h / 2 - Math.cos(angleB) * 15;

                                    player.portalCooldown = 0.5;
                                    spawnSparks(player.x, player.y); // Exit sparks
                                }
                            }
                        } else {
                            // Default wind/gravity logic
                            player.vx += (zone.forceX || 0) * dt;
                            player.vy += (zone.forceY || 0) * dt;
                        }
                    } else {
                        if (zone.type === 'boost') {
                            zone.playerInside = false;
                        }
                    }
                }
            }

            // Rotation is preserved even in EMP
            if (keys['a'] || keys['arrowleft']) { player.angle -= ROTATION_SPEED * dt; }
            if (keys['d'] || keys['arrowright']) { player.angle += ROTATION_SPEED * dt; }

            // Main Thruster is disabled inside an EMP AND when out of fuel
            if (keys['w'] || keys['arrowup']) {
                if (!empActive && player.fuel > 0) {
                    player.vx += Math.sin(player.angle) * THRUST * dt;
                    player.vy -= Math.cos(player.angle) * THRUST * dt;

                    // Handle limited fuel drainage
                    if (player.maxFuel !== Infinity) {
                        player.fuel -= 25 * (dt / 60); // Costs 25 fuel units per second
                        if (player.fuel < 0) player.fuel = 0;
                    }

                    thrusterFlicker = Math.min(1.0, thrusterFlicker + 0.1 * dt);

                    exhaustTimer += dt;
                    if (exhaustTimer >= 1.0) {
                        spawnExhaustParticles();
                        exhaustTimer = 0;
                    }
                } else {
                    thrusterFlicker = Math.max(0, thrusterFlicker - 0.1 * dt);
                }
            } else {
                thrusterFlicker = Math.max(0, thrusterFlicker - 0.05 * dt);
                exhaustTimer = 1.0;
            }

            if (typeof AudioSystem !== 'undefined') {
                AudioSystem.startEngine();
                AudioSystem.updateEngine(thrusterFlicker);
            }

            if (!currentLevel.zeroGravity) {
                player.vy += GRAVITY * dt;

            player.x += player.vx * dt;
            player.y += player.vy * dt;

            const shipRadius = 12;

            // Process Items (Keys and Fuel Canisters)
            if (activeItems.length > 0) {
                for (let item of activeItems) {
                    if (!item.collected) {
                        let dx = player.x - item.x;
                        let dy = player.y - item.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        let hitDist = shipRadius + (item.radius || (item.type === 'fuel' ? 22.5 : 15));

                        if (dist < hitDist) {
                            item.collected = true;
                            spawnSparks(item.x, item.y);

                            if (item.type === 'fuel') {

            let crashedThisFrame = false;
            let speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);

                if (player.vx < 0) {
                    if (speed > 15.0) crashedThisFrame = true;
                    else { player.vx *= -0.3; spawnSparks(player.x - shipRadius, player.y); }
                }
            } else if (player.x + shipRadius > currentLevel.width) {
                player.x = currentLevel.width - shipRadius;
                if (player.vx > 0) {
                    if (speed > 15.0) crashedThisFrame = true;
                    else { player.vx *= -0.3; spawnSparks(player.x + shipRadius, player.y); }
                }
            }

            if (player.y - shipRadius < 0) {
                player.y = shipRadius;
                if (player.vy < 0) {
                    if (speed > 15.0) crashedThisFrame = true;
                    else { player.vy *= -0.3; spawnSparks(player.x, player.y - shipRadius); }
                }
            }

            let cos = Math.cos(player.angle);
            let sin = Math.sin(player.angle);

            let p1x = player.x + (player.h / 2) * sin;
            let p1y = player.y + (-player.h / 2) * cos;
            let p2x = player.x + (player.w / 2) * cos - (player.h / 2) * sin;
            let p2y = player.y + (player.w / 2) * sin + (player.h / 2) * cos;
            let p3x = player.x + (-player.w / 2) * cos - (player.h / 2) * sin;
            let p3y = player.y + (-player.w / 2) * sin + (player.h / 2) * cos;

            let minX = Math.min(p1x, p2x, p3x);
            let maxX = Math.max(p1x, p2x, p3x);
            let maxY = Math.max(p1y, p2y, p3y);

            // --- UPDATE MOVING, ROTATING & TRIGGERED OBSTACLES ---
            for (let obs of obstacles) {
                let recalculate = false;

                if (obs.isMoving) {
                    let phase = (1 - Math.cos(timer * obs.speed)) / 2;
                    let cx = obs.startX + (obs.endX - obs.startX) * phase;
                    let cy = obs.startY + (obs.endY - obs.startY) * phase;

                    obs.vertices = [
                        { x: cx, y: cy },
                        { x: cx + obs.w, y: cy },
                        { x: cx + obs.w, y: cy + obs.h },
                        { x: cx, y: cy + obs.h }
                    ];
                    recalculate = true;

                } else if (obs.isRotating) {

                    if (obs.initialAngle) angle += obs.initialAngle;

                    let cosA = Math.cos(angle);
                    let sinA = Math.sin(angle);

                    obs.vertices = obs.baseVertices.map(v => {

                            x: obs.cx + (v.x * cosA - v.y * sinA),
                            y: obs.cy + (v.x * sinA + v.y * cosA)
                        };

                if (recalculate) {
                    let normals = [];
                    let obsMinX = Infinity, obsMaxX = -Infinity, obsMinY = Infinity, obsMaxY = -Infinity;

            }

            for (let pad of currentLevel.safePads) {
                if (player.vy >= 0 && maxY >= pad.y && maxY - player.vy * dt <= pad.y + 15) {
                    if (Math.max(minX, pad.x) <= Math.min(maxX, pad.x + pad.w)) {
                        player.y -= (maxY - pad.y);

                        landedPad = pad;
                        if (pad.isTarget) onTargetPad = true;
                        if (pad.isStart) onStartPad = true;
