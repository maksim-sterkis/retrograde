                    }
                }
            }

            // --- 3. FLOOR / PAD OUTCOMES ---
            if (hitFloorOrPad) {
                const normAngle = getNormalizedAngle();
                const isUpright = Math.abs(normAngle) <= MAX_ANGLE;
                const isSlow = Math.abs(player.vx) <= MAX_LAND_VX && Math.abs(player.vy) <= MAX_LAND_VY;

                if (isUpright && isSlow) {
                    if (onTargetPad) {
                        if (state !== 'won' && state !== 'victory') {
                            spawnLandingDust(player.x, player.y + player.h / 2);

                            let targetFinalIndex = customFinalLevel !== null ? customFinalLevel : levels.length - 1;
                            let isFinalLevel = (currentLevelIndex === targetFinalIndex);
                            state = (isFinalLevel && !isPracticeMode && !currentLevel.isTutorial) ? 'victory' : 'won';
                            if (typeof AudioSystem !== 'undefined') {
                                AudioSystem.playSafeLand();
                                AudioSystem.updateEngine(0);
                            }

                            player.vx = 0;
                            player.vy = 0;
                            player.angle -= normAngle; // Visual seamless snap

                            if (typeof gtag === 'function') {
                                gtag('event', 'level_up', {
                                    'level_number': currentLevel.isTutorial ? 'Tutorial' : currentLevelIndex + 1,
                                    'version': 'v10'
                                });
                            }

                            if (!currentLevel.isTutorial) {
                                let prevBest = saveData.bestLevels[currentLevelIndex];

                                if (prevBest === null || prevBest === undefined) {
                                    currentSplitStatus = 'NEW';
                                } else {
                                    currentSplitDelta = timer - prevBest;
                                    if (currentSplitDelta < -0.0005) currentSplitStatus = 'FASTER';
                                    else if (currentSplitDelta > 0.0005) currentSplitStatus = 'SLOWER';
                                    else currentSplitStatus = 'SAME';
                                }

                                if (runState === 'active' && !isPracticeMode) {
                                    let sumBest = 0;
                                    let hasAllBest = true;
                                    for (let i = 0; i <= currentLevelIndex; i++) {
                                        let best = (i === currentLevelIndex) ? prevBest : saveData.bestLevels[i];
                                        if (best === null || best === undefined) {
                                            hasAllBest = false;
                                            break;
                                        }
                                        sumBest += best;
                                    }
                                    if (hasAllBest) {
                                        currentRunIGTDelta = (currentRunIGT + timer) - sumBest;
                                    } else {
                                        currentRunIGTDelta = null;
                                    }

                                    let prevRTASplit = saveData.bestRTASplits[currentLevelIndex];
                                    if (prevRTASplit !== null && prevRTASplit !== undefined) {
                                        currentRunRTADelta = currentRunRTA - prevRTASplit;
                                    } else {
                                        currentRunRTADelta = null;
                                    }

                                    if (prevRTASplit === null || currentRunRTA < prevRTASplit) {
                                        saveData.bestRTASplits[currentLevelIndex] = currentRunRTA;
                                    }
                                } else {
                                    currentRunIGTDelta = null;
                                    currentRunRTADelta = null;
                                }

                                if (prevBest === null || timer < prevBest) {
                                    saveData.bestLevels[currentLevelIndex] = timer;
                                    storeSaveData();
                                    if (typeof db !== 'undefined' && !cheatsEnabled && customFinalLevel === null) {
                                        db.submitRun('IL', timer, timer, currentLevelIndex);
                                    }
                                }

                                // CAMPAIGN SAVE PROGRESS
                                if (!isPracticeMode) {
                                    if (isFinalLevel) {
                                        saveData.campaignProgress = 0;
                                    } else {
                                        let nextIndex = currentLevelIndex + 1;
                                        let freq = saveData.saveFrequency || 'level';
                                        if (freq === 'level') {
                                            saveData.campaignProgress = nextIndex;
                                        } else if (freq === '10' && nextIndex % 10 === 0) {
                                            saveData.campaignProgress = nextIndex;
                                        }
                                    }
                                    storeSaveData();
                                }

                                if (runState === 'active' && !isPracticeMode) {
                                    currentRunIGT += timer;
                                    saveData.casualIGT = currentRunIGT;
                                    saveData.casualRTA = currentRunRTA;
                                    storeSaveData();

                                    if (isFinalLevel) {
                                        victoryData.rta = currentRunRTA;
                                        victoryData.igt = currentRunIGT;
                                        victoryData.invalid = runInvalidated;

                                        if (!runInvalidated) {
                                            victoryData.newRTA = (saveData.bestRTA === null || currentRunRTA < saveData.bestRTA);
                                            victoryData.newIGT = (saveData.bestIGT === null || currentRunIGT < saveData.bestIGT);

                                            if (customFinalLevel === null) {
                                                if (victoryData.newRTA) saveData.bestRTA = currentRunRTA;
                                                if (victoryData.newIGT) saveData.bestIGT = currentRunIGT;
                                                storeSaveData();
                                                if (typeof db !== 'undefined' && !cheatsEnabled) {
                                                    db.submitRun('Speedrun', currentRunRTA, currentRunIGT);
                                                }
                                            }
                                        } else {
                                            victoryData.newRTA = false;
                                            victoryData.newIGT = false;
                                            if (typeof db !== 'undefined' && !cheatsEnabled && customFinalLevel === null) {
                                                db.submitRun('Casual', currentRunRTA, currentRunIGT);
                                            }
                                        }

                                        runState = 'inactive';
                                    }
                                }
                            } else {
                                let prevBest = saveData.bestTutorial;

                                if (prevBest === null || prevBest === undefined) {
                                    currentSplitStatus = 'NEW';
                                } else {
                                    currentSplitDelta = timer - prevBest;
                                    if (currentSplitDelta < -0.0005) currentSplitStatus = 'FASTER';
                                    else if (currentSplitDelta > 0.0005) currentSplitStatus = 'SLOWER';
                                    else currentSplitStatus = 'SAME';
                                }

                                if (prevBest === null || timer < prevBest) {
                                    saveData.bestTutorial = timer;
                                    storeSaveData();
                                }
                            }

                            if (state === 'won' && isSpeedrunMode && !isPracticeMode) {
                                deltaDisplayTimer = 2.0;
                                let targetFinalIndex = customFinalLevel !== null ? customFinalLevel : levels.length - 1;
                                if (!currentLevel.isTutorial && currentLevelIndex < targetFinalIndex) {
                                    currentLevelIndex++;
                                    loadLevel(currentLevelIndex);
                                }
                            }
                        }
                    } else {
                        player.vy = 0;
                        player.vx *= 0.85;
                        // Fix angle snap glitch: gently pull the normalized angle towards 0
                        player.angle -= normAngle * 0.2;

                        // Only reset time if landing securely on the launch pad
                        if (onStartPad) {
                            timer = 0;
                            timerRunning = false;
                            hasMoved = false;
                        }
                    }
                } else {
                    crashedThisFrame = true; // Landed too hard or tilted!
                }
            } else {
                // --- 4. SAT OBSTACLE DETECTION (Strict touch = crash rule from v8.2) ---
                let circle = { x: player.x, y: player.y, r: shipRadius };

                // Use spatial grid for broad-phase: only test obstacles near the player
                let nearbyObs = SpatialGrid.queryRect(
                    circle.x - circle.r, circle.y - circle.r,
                    circle.x + circle.r, circle.y + circle.r
                );

                for (let ni = 0; ni < nearbyObs.length; ni++) {
                    let obs = nearbyObs[ni];

                    // AABB narrow check (still useful since grid cells are larger than obstacles)
                    if (circle.x + circle.r < obs.aabb.minX || circle.x - circle.r > obs.aabb.maxX ||
                        circle.y + circle.r < obs.aabb.minY || circle.y - circle.r > obs.aabb.maxY) {
                        continue;
                    }

                    // Strict, robust Narrow phase (SAT)
                    if (testCirclePolygon(circle, obs)) {
                        crashedThisFrame = true;
                        break;
                    }
                }
            }

            // --- 5. FINALIZE CRASH ---
            if (crashedThisFrame && state !== 'won' && state !== 'victory') {
                state = 'lost';
                screenShake = 30;
                if (typeof AudioSystem !== 'undefined') AudioSystem.updateEngine(0);
                spawnExplosion(player.x, player.y);
            }

            // Timer Management Fix
            if (hasMoved && state === 'playing' && !timerRunning) {
                timerRunning = true;
            }

            if (state === 'won' || state === 'victory' || state === 'lost') {
                timerRunning = false;
            }

            if (timerRunning) {
                timer += dt / 60;
            }
        }

        updateCamera();
    }

    for (let p of ambientDust) {
        p.x += p.baseVx * dt;
        p.y += p.baseVy * dt;
        while (p.x < camera.x - 100) p.x += canvas.width + 200;
        while (p.x > camera.x + canvas.width + 100) p.x -= canvas.width + 200;
        while (p.y < camera.y - 100) p.y += canvas.height + 200;
        while (p.y > camera.y + canvas.height + 100) p.y -= canvas.height + 200;
    }

    for (let i = 0; i < particles.length; i++) {
        let p = particles[i];
        if (!p.active) continue;

        let dx = p.vx * dt;
        let dy = p.vy * dt;

        if (p.type === 'exhaust') {
            let hit = false;
            // Use spatial grid: only check obstacles in the particle's cell
            let cellObs = SpatialGrid.query(p.x + dx, p.y + dy);
            for (let ci = 0; ci < cellObs.length; ci++) {
                let obs = cellObs[ci];
                if (p.x + dx < obs.aabb.minX || p.x + dx > obs.aabb.maxX || p.y + dy < obs.aabb.minY || p.y + dy > obs.aabb.maxY) continue;
                if (testCirclePolygon({ x: p.x + dx, y: p.y + dy, r: 2 }, obs)) {
                    hit = true;
                    break;
                }
            }
            if (hit) {
                p.vx *= 0.5;
                p.vy *= 0.5;
            } else {
                p.x += dx;
                p.y += dy;
            }
        } else {
            p.x += dx;
            p.y += dy;
        }

        p.life -= (p.type === 'explosion' ? 0.015 : 0.05) * dt;

        if (p.life <= 0) {
            p.active = false;
        }
    }
}

function draw() {
    ctx.fillStyle = currentLevel.theme?.bg || '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (currentLevel.theme && currentLevel.theme.parallaxType) {
        for (let layer of parallaxLayers) {
            ctx.fillStyle = layer.color;

            let renderCamX = camera.x + (camera.shakeX || 0);
            let renderCamY = camera.y + (camera.shakeY || 0);
            let offsetX = ((renderCamX * layer.speed) % layer.loopWidth + layer.loopWidth) % layer.loopWidth;
            let offsetY = renderCamY * layer.speed;

            for (let i = -1; i <= 2; i++) {
                let transX = -offsetX + (i * layer.loopWidth);
                let transY = -offsetY;
                ctx.translate(transX, transY);
                for (let s of layer.shapes) {
                    if (s.type === 'peak') {
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(s.x + s.w / 2, s.y - s.h);
                        ctx.lineTo(s.x + s.w, s.y);
                        ctx.fill();
                    } else if (s.type === 'rect') {
                        ctx.fillRect(s.x, s.y, s.w, s.h);
                    } else if (s.type === 'star') {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.translate(-transX, -transY);
            }
        }
    }

    ctx.save();
    let renderCamX = camera.x + (camera.shakeX || 0);
    let renderCamY = camera.y + (camera.shakeY || 0);
    ctx.translate(-renderCamX, -renderCamY);

    // Viewport-culled dot grid: only draw dots visible on screen
    ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
    let dotStartX = Math.max(0, Math.floor(renderCamX / 100) * 100);
    let dotStartY = Math.max(0, Math.floor(renderCamY / 100) * 100);
    let dotEndX = Math.min(currentLevel.width, renderCamX + canvas.width + 100);
    let dotEndY = Math.min(currentLevel.height, renderCamY + canvas.height + 100);
    for (let x = dotStartX; x <= dotEndX; x += 100) {
        for (let y = dotStartY; y <= dotEndY; y += 100) {
            ctx.fillRect(x, y, 2, 2);
        }
    }

    // Render AoE Zones Backgrounds & Wind/Portal Effects
    if (state !== 'menu' && activeZones.length > 0) {
        for (let zone of activeZones) {
            ctx.fillStyle = zone.color || 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(zone.x, zone.y, zone.w, zone.h);

            ctx.save();
            ctx.beginPath();
            ctx.rect(zone.x, zone.y, zone.w, zone.h);
            ctx.clip();

            let showZoneEffects = (saveData.visualEffects === 'high' || saveData.visualEffects === 'medium');

            if (zone.type === 'emp') {
                // Scanning disruptor line
                let scanY = (timer * 200) % zone.h;
                ctx.fillStyle = 'rgba(255, 255, 0, 0.4)';
                ctx.fillRect(zone.x, zone.y + scanY, zone.w, 8);

                // Static noise overlay only on high/medium settings
                if (showZoneEffects) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                    for (let i = 0; i < 10; i++) {
                        let sx = zone.x + Math.random() * zone.w;
                        let sy = zone.y + Math.random() * zone.h;
                        ctx.fillRect(sx, sy, Math.random() * 20 + 10, 2);
                    }
                }
            } else if (zone.type === 'boost') {
                // Pulsing borders
                let pulse = (1 + Math.sin(timer * 15)) / 2;
                ctx.lineWidth = showZoneEffects ? (4 + pulse * 4) : 4;
                ctx.strokeStyle = showZoneEffects ? `rgba(0, 255, 255, ${0.8 - pulse * 0.5})` : 'rgba(0, 255, 255, 0.6)';
                ctx.strokeRect(zone.x + 2, zone.y + 2, zone.w - 4, zone.h - 4);
            } else if (zone.type === 'portal' || zone.type === 'portal_exit') {
                // Glowing portal effect (bloom)
                let pulse = (1 + Math.sin(timer * 5)) / 2;
                let portalColor = zone.color || 'rgba(200, 0, 255, 0.5)';

                if (showZoneEffects) {
                    ctx.shadowBlur = 15 + pulse * 20;
                    ctx.shadowColor = portalColor;
                }
                ctx.strokeStyle = portalColor;
                ctx.lineWidth = showZoneEffects ? (2 + pulse * 2) : 2;

                ctx.strokeRect(zone.x, zone.y, zone.w, zone.h);
                ctx.fillStyle = portalColor.replace('0.4', '0.1').replace('0.5', '0.1'); // slight fill
                ctx.fillRect(zone.x, zone.y, zone.w, zone.h);
                ctx.shadowBlur = 0;
            } else {
                // Wind logic
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();

                let forceMag = Math.sqrt((zone.forceX || 0) * (zone.forceX || 0) + (zone.forceY || 0) * (zone.forceY || 0));
                if (forceMag > 0) {
                    let densityDivisor = showZoneEffects ? 8000 : 16000;
                    let numLines = Math.floor((zone.w * zone.h) / densityDivisor);
                    if (numLines === 0 && (zone.w * zone.h) > 0) {
                        numLines = 2; // Make sure at least a couple of lines are drawn for gameplay visibility
                    }
                    let speed = forceMag * 400; // Visual wind speed scalar
                    let angle = Math.atan2(zone.forceY, zone.forceX);
                    let cosA = Math.cos(angle);
                    let sinA = Math.sin(angle);

                    for (let i = 0; i < numLines; i++) {
                        // Seeded pseudo-random coordinates
                        let seedX = (i * 9301 + 49297) % 233280 / 233280;
                        let seedY = (i * 49297 + 9301) % 233280 / 233280;

                        let lineX = seedX * zone.w;
                        let lineY = seedY * zone.h;

                        let moveDist = timer * speed + (i * 100);

                        let drawX = (lineX + moveDist * cosA) % zone.w;
                        if (drawX < 0) drawX += zone.w;

                        let drawY = (lineY + moveDist * sinA) % zone.h;
                        if (drawY < 0) drawY += zone.h;

                        let absX = zone.x + drawX;
                        let absY = zone.y + drawY;

                        ctx.moveTo(absX, absY);
                        ctx.lineTo(absX - 15 * cosA, absY - 15 * sinA);
                    }
                }
                ctx.stroke();
            }
            ctx.restore();
        }
    }

// Draw Keys / Fuel Items

if (state !== 'menu') {

    // Rendering Custom Arbitrary Polygons
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 2;
    for (let obs of obstacles) {
        ctx.beginPath();
        ctx.moveTo(obs.vertices[0].x, obs.vertices[0].y);
        for (let i = 1; i < obs.vertices.length; i++) {
            ctx.lineTo(obs.vertices[i].x, obs.vertices[i].y);
        }
        ctx.closePath();
        ctx.stroke();
    }

    if (typeof window.cachedPatterns === 'undefined') window.cachedPatterns = {};

    for (let obs of obstacles) {
        let pType = obs.texture;
        if (!pType) {
            pType = currentLevel.theme?.parallaxType;
            if (pType !== 'caves' && pType !== 'lightCaves') pType = 'metal';
        }

        if (!window.cachedPatterns[pType]) {
            if ((pType === 'caves' || pType === 'cave') && Textures.cave) window.cachedPatterns[pType] = ctx.createPattern(Textures.cave, 'repeat');
            else if ((pType === 'lightCaves' || pType === 'lightCave') && Textures.lightCave) window.cachedPatterns[pType] = ctx.createPattern(Textures.lightCave, 'repeat');
            else if (pType === 'metal' && Textures.metal) window.cachedPatterns[pType] = ctx.createPattern(Textures.metal, 'repeat');
            else if (pType === 'metalDark' && Textures.metalDark) window.cachedPatterns[pType] = ctx.createPattern(Textures.metalDark, 'repeat');
            else if (pType === 'hazard' && Textures.hazard) window.cachedPatterns[pType] = ctx.createPattern(Textures.hazard, 'repeat');
            else if (pType === 'strut' && Textures.strut) window.cachedPatterns[pType] = ctx.createPattern(Textures.strut, 'repeat');
            else if (pType === 'scaffold' && Textures.scaffold) window.cachedPatterns[pType] = ctx.createPattern(Textures.scaffold, 'repeat');
            else if (pType === 'asteroid' && Textures.asteroid) window.cachedPatterns[pType] = ctx.createPattern(Textures.asteroid, 'repeat');
        }

        ctx.save();
        let shouldAlign = obs.isIsolated || pType === 'strut' || pType === 'scaffold' || pType === 'metal' || pType === 'metalDark' || typeof obs.speed !== 'undefined';
        if (shouldAlign) {
            if (obs.isRotating && obs.currentAngle !== undefined) {
                ctx.translate(obs.cx, obs.cy);
                ctx.rotate(obs.currentAngle);
            } else {
                ctx.translate(obs.aabb.minX, obs.aabb.minY);
            }
        }
        
        ctx.fillStyle = window.cachedPatterns[pType] || currentLevel.theme?.obj || '#334155';

        ctx.beginPath();
        if (shouldAlign) {
            if (obs.isRotating && obs.currentAngle !== undefined) {
                ctx.moveTo(obs.baseVertices[0].x, obs.baseVertices[0].y);
                for (let i = 1; i < obs.baseVertices.length; i++) {
                    ctx.lineTo(obs.baseVertices[i].x, obs.baseVertices[i].y);
                }
            } else {
                ctx.moveTo(obs.vertices[0].x - obs.aabb.minX, obs.vertices[0].y - obs.aabb.minY);
                for (let i = 1; i < obs.vertices.length; i++) {
                    ctx.lineTo(obs.vertices[i].x - obs.aabb.minX, obs.vertices[i].y - obs.aabb.minY);
                }
            }
        } else {
            ctx.moveTo(obs.vertices[0].x, obs.vertices[0].y);
            for (let i = 1; i < obs.vertices.length; i++) {
                ctx.lineTo(obs.vertices[i].x, obs.vertices[i].y);
            }
        }
        ctx.closePath();
        ctx.fill();
        
        // Dynamic features for metal panels
        if (pType === 'metal' || pType === 'metalDark') {
            let bw = obs.aabb.maxX - obs.aabb.minX;
            let bh = obs.aabb.maxY - obs.aabb.minY;
            
            ctx.save();
            if (!shouldAlign) {
                // If it wasn't aligned for the pattern fill, align it now so drawing is local
                ctx.translate(obs.aabb.minX, obs.aabb.minY);
            }
            
            // Determine how many grid panels to draw (split if > 4x default size of 128)
            let cols = Math.ceil(bw / 512);
            let rows = Math.ceil(bh / 512);
            let cellW = bw / cols;
            let cellH = bh / rows;
            
            ctx.lineWidth = 2;
            
            for (let c = 0; c < cols; c++) {
                for (let r = 0; r < rows; r++) {
                    let cx = Math.floor(c * cellW);
                    let cy = Math.floor(r * cellH);
                    let nextX = Math.floor((c + 1) * cellW);
                    let nextY = Math.floor((r + 1) * cellH);
                    let w = nextX - cx;
                    let h = nextY - cy;
                    
                    // Border for the cell
                    ctx.strokeStyle = pType === 'metalDark' ? 'rgba(0,0,0,0.9)' : 'rgba(0,0,0,0.8)';
                    ctx.strokeRect(cx + 1, cy + 1, w - 2, h - 2);
                    
                    if (pType === 'metal') {
                        // Cross brace
                        ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                        ctx.beginPath();
                        ctx.moveTo(cx + 1, cy + 1);
                        ctx.lineTo(cx + w - 1, cy + h - 1);
                        ctx.moveTo(cx + w - 1, cy + 1);
                        ctx.lineTo(cx + 1, cy + h - 1);
                        ctx.stroke();
                        
                        // Corner Rivets
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        
                        const drawRivet = (rx, ry) => {
                            ctx.beginPath();
                            ctx.arc(rx, ry, 2.5, 0, Math.PI * 2);
                            ctx.fill();
                        };
                        
                        drawRivet(cx + 12, cy + 12);
                        drawRivet(cx + w - 12, cy + 12);
                        drawRivet(cx + 12, cy + h - 12);
                        drawRivet(cx + w - 12, cy + h - 12);
                    }
                }
            }
            ctx.restore();
        }
        
        ctx.restore();
    }

    for (let pad of currentLevel.safePads) {
        if (Textures.safePad) {
            if (!window.cachedPatterns['safePad']) {
                window.cachedPatterns['safePad'] = ctx.createPattern(Textures.safePad, 'repeat');
            }
            ctx.fillStyle = window.cachedPatterns['safePad'];
            // Draw a box for the pad instead of just a line
            ctx.fillRect(pad.x, pad.y, pad.w, 10);
        }
        ctx.strokeStyle = pad.isTarget ? '#00FF00' : '#fff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(pad.x, pad.y);
        ctx.lineTo(pad.x + pad.w, pad.y);
        ctx.stroke();

        ctx.fillStyle = pad.isTarget ? '#00FF00' : '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 14px monospace';

        let text = "SAFE PAD";
        if (pad.isStart) text = "LAUNCH PAD";
        if (pad.isTarget) text = "LANDING PAD";

        ctx.fillText(text, pad.x + (pad.w / 2), pad.y + 20);

        if (pad.isStart) {
            let targetPad = currentLevel.safePads.find(p => p.isTarget);
            if (targetPad) {
                let startCx = pad.x + pad.w / 2;
                let startCy = pad.y;
                let targetCx = targetPad.x + targetPad.w / 2;
                let targetCy = targetPad.y;

                let angle = Math.atan2(targetCy - startCy, targetCx - startCx);

                ctx.save();
                ctx.translate(startCx, startCy - 40);
                ctx.rotate(angle);

                ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0ff';

                ctx.beginPath();
                ctx.moveTo(25, 0);
                ctx.lineTo(5, 10);
                ctx.lineTo(5, -10);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(25, 0);
                ctx.lineTo(100, 0);
                ctx.stroke();

                ctx.restore();
            }
        }
    }
}

for (let i = 0; i < particles.length; i++) {

    if (!p.active) continue;

    if (p.type === 'explosion') {
        let size = Math.max(0.1, p.life * 15);
        ctx.fillStyle = `rgba(255, 200, 50, ${p.life})`;
        ctx.fillRect(p.x - size / 2, p.y - size / 2, size, size);
    } else if (p.type === 'spark') {
        if (useBlur) {
            ctx.shadowBlur = 10 * p.life;
            ctx.shadowColor = `rgba(255, 255, 0, ${p.life})`;
        }
        ctx.strokeStyle = `rgba(255, 200, 50, ${p.life * 1.5})`;
        ctx.lineWidth = 2 * p.life;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2);
        ctx.stroke();
        if (useBlur) ctx.shadowBlur = 0;
    } else if (p.type === 'exhaust') {
        let size = 3 + (1.0 - p.life) * 15;
        let alpha = p.life * 0.8;

        // Simplified color selection — avoid per-particle string construction when possible
        if (currentLevel.theme?.parallaxType === 'lightCaves') {
            if (p.life > 0.6) {
                ctx.fillStyle = `rgba(255, 200, 100, ${alpha})`;
            } else if (p.life > 0.3) {
                ctx.fillStyle = `rgba(255, 150, 50, ${alpha})`;
            } else {
                ctx.fillStyle = `rgba(50, 50, 50, ${alpha * 0.5})`;
            }
        } else {
            if (p.life > 0.6) {
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
            } else if (p.life > 0.3) {
                ctx.fillStyle = `rgba(${lightColor}, ${alpha})`;
            } else {
                ctx.fillStyle = `rgba(50, 50, 50, ${alpha * 0.5})`;
            }
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawShipEntity(shipObj, flickerAmount) {
    ctx.save();
    ctx.translate(shipObj.x, shipObj.y);
    ctx.rotate(shipObj.angle);

    let activeFlicker = flickerAmount > 0 ? flickerAmount * (0.8 + Math.random() * 0.2) : 0;
    if (activeFlicker > 0.01) {
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        let ambientGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 500);
        ambientGrad.addColorStop(0, `rgba(${lightColor}, ${0.15 * activeFlicker})`);
        ambientGrad.addColorStop(1, `rgba(${lightColor}, 0)`);
        ctx.fillStyle = ambientGrad;
        ctx.fillRect(-500, -500, 1000, 1000);

        ctx.translate(0, 15);
        ctx.scale(1, 1.5);

        let flareGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 18);
        flareGrad.addColorStop(0, `rgba(255, 255, 255, ${activeFlicker})`);
        flareGrad.addColorStop(0.3, `rgba(${lightColor}, ${0.8 * activeFlicker})`);
        flareGrad.addColorStop(1, `rgba(${lightColor}, 0)`);
        ctx.fillStyle = flareGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000000';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(0, -shipObj.h / 2);
    ctx.lineTo(shipObj.w / 2, shipObj.h / 2);
    ctx.lineTo(-shipObj.w / 2, shipObj.h / 2);
    ctx.closePath();

    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

    ctx.strokeStyle = '#0ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(termX, termY, termW, termH);

    ctx.fillStyle = '#0ff';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'left';
    ctx.shadowBlur = 10;
    ctx.shadowColor = '#0ff';

    const cursor = Math.floor(Date.now() / 500) % 2 === 0 ? '_' : ' ';
    ctx.fillText(`> ${terminalInput}${cursor}`, termX + 20, termY + 48);
    ctx.shadowBlur = 0;
}

if (isPaused) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#00ffcc';
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#00ffcc';
    ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2 - 20);

    ctx.shadowBlur = 0;
    ctx.font = 'bold 20px monospace';
    let pulse = Math.abs(Math.sin(Date.now() / 300));
    ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + pulse * 0.6})`;
    ctx.fillText(">> PRESS [ENTER] TO RESUME <<", canvas.width / 2, canvas.height / 2 + 30);
}

if (transitionAlpha > 0) {
    ctx.fillStyle = `rgba(0, 0, 0, ${transitionAlpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let glitchIntensity = transitionAlpha * 40;
    ctx.globalCompositeOperation = 'screen';

    ctx.fillStyle = `rgba(255, 0, 0, ${transitionAlpha * 0.4})`;
    for (let i = 0; i < 5; i++) {
        ctx.fillRect((Math.random() - 0.5) * glitchIntensity, Math.random() * canvas.height, canvas.width, Math.random() * 6 + 1);
    }

    ctx.fillStyle = `rgba(0, 200, 255, ${transitionAlpha * 0.4})`;
    for (let i = 0; i < 5; i++) {
        ctx.fillRect((Math.random() - 0.5) * glitchIntensity, Math.random() * canvas.height, canvas.width, Math.random() * 6 + 1);
    }

    ctx.fillStyle = `rgba(255, 255, 255, ${transitionAlpha * 0.3})`;
    for (let i = 0; i < 10; i++) {
        ctx.fillRect(0, Math.random() * canvas.height, canvas.width, Math.random() * 3 + 1);
    }
    ctx.globalCompositeOperation = 'source-over';
}
}

</script>
    <script>
// FPS counter
let _fpsFrames = 0;
let _fpsTime = 0;
let _fpsDisplay = 0;
let globalError = null;

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    if (globalError) return;
    try {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        if (runState === 'active' && state !== 'menu' && state !== 'victory' && !isPaused && !document.hidden) {
            // Ignore massive deltaTimes (e.g. returning to the tab) so RTA doesn't suddenly spike
            if (deltaTime < 500) {
                currentRunRTA += deltaTime / 1000;
            }
        }

        let dt = deltaTime / (1000 / 60);
        if (dt > 3.0) dt = 3.0;

        update(dt);
        if (typeof MusicSystem !== 'undefined') MusicSystem.setState(state);
        draw();

        // FPS counter (top-right)
        _fpsFrames++;
        _fpsTime += deltaTime;
        if (_fpsTime >= 500) {
            _fpsDisplay = Math.round((_fpsFrames / _fpsTime) * 1000);
            _fpsFrames = 0;
            _fpsTime = 0;
        }
        if (saveData.showFPS) {
            ctx.fillStyle = '#0f0';
            ctx.font = '14px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`${_fpsDisplay} FPS`, canvas.width - 10, canvas.height - 10);
        }

        requestAnimationFrame(gameLoop);
    } catch (e) {
        globalError = e;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f00';
        ctx.font = '16px monospace';
        ctx.textAlign = 'left';
        ctx.fillText("CRITICAL ERROR: " + e.message, 50, 50);
        ctx.fillText(e.stack.split('\n')[1] || "", 50, 80);
        ctx.fillText(e.stack.split('\n')[2] || "", 50, 110);
    }
}

window.addEventListener('beforeunload', (e) => {
    // This will catch Live Server reloads, Cmd+R, and tab navigation.
    // It will show a browser confirmation popup.
    if (state !== 'menu') {
        // Force immediate save before page unloads
        saveData.casualRTA = currentRunRTA;
        saveData.casualIGT = currentRunIGT;
        storeSaveDataImmediate();
        e.preventDefault();
        e.returnValue = '';
    }
});

goToMenu();
requestAnimationFrame(gameLoop);
</script>
