                        saveData.visualEffects = parsed.visualEffects;
                    }

                        saveData.showTimer = parsed.showTimer;
                    }

                    if (parsed.bestLevels.length === levels.length) {
                        if (parsed.bestRTA !== undefined) saveData.bestRTA = parsed.bestRTA;
                        if (parsed.bestIGT !== undefined) saveData.bestIGT = parsed.bestIGT;
                    } else {
                        saveData.bestRTA = null;
                        saveData.bestIGT = null;
                        needsUpdate = true;
                    }

                    if (parsed.bestLevels.length !== levels.length) {
                        needsUpdate = true;
                    }

                    if (needsUpdate) {
                        storeSaveData();
                    }
                }
            }
            MAX_PARTICLES = saveData.visualEffects === 'high' ? 800 : 200;
        } catch(e) { console.error("Save load failed", e); }
    }

    function storeSaveData() {
        try {
            localStorage.setItem('retrograde_save', JSON.stringify(saveData));
        } catch(e) { console.error("Save store failed", e); }

    // --- ENCODE/DECODE PASSWORD ALGORITHM ---
    function generateSaveCode() {
        let sumOfBests = 0;
        let hasAll = true;
        for (let i = 0; i < levels.length; i++) {
            if (saveData.bestLevels[i] === null) hasAll = false;
            else sumOfBests += saveData.bestLevels[i];
        }
        let sobToSave = hasAll ? sumOfBests : null;

        let dataArr = [...saveData.bestLevels, saveData.bestRTA, saveData.bestIGT, sobToSave];
        let sum = 0;

        let strArr = dataArr.map(val => {
            if (val === null) return "N";
            let formatted = val.toFixed(3);
            sum += parseFloat(formatted); // FIX: Accumulate the exact rounded value being saved
            return formatted;
        });

        let checksum = sum * 7;
        strArr.push(checksum.toFixed(3));

        let tutStr = saveData.bestTutorial === null ? "TN" : "T" + saveData.bestTutorial.toFixed(3);
        strArr.splice(strArr.length - 1, 0, tutStr);

        let rawStr = strArr.join(',');

        let shiftedStr = "";
        for(let i = 0; i < rawStr.length; i++) {
            shiftedStr += String.fromCharCode(rawStr.charCodeAt(i) + 3);
        }

        return btoa(shiftedStr);
    }

    function parseSaveCode(code) {
        try {
            let shiftedStr = atob(code);
            let rawStr = "";
            for(let i = 0; i < shiftedStr.length; i++) {
                rawStr += String.fromCharCode(shiftedStr.charCodeAt(i) - 3);
            }

            let parts = rawStr.split(',');
            if (parts.length < 14) return false;

            let parsedVals = [];
            let sum = 0;
            let parsedTutorial = null;

            for(let i = 0; i < parts.length - 1; i++) {
                if (typeof parts[i] === 'string' && parts[i].startsWith('T')) {
                    let valStr = parts[i].substring(1);
                    if (valStr !== 'N') {
                        parsedTutorial = parseFloat(valStr);
                        if (isNaN(parsedTutorial)) return false;
                    }
                } else if (parts[i] === "N") {
                    parsedVals.push(null);
                } else {
                    let val = parseFloat(parts[i]);
                    if (isNaN(val)) return false;
                    parsedVals.push(val);
                    sum += val;
                }
            }

            let checksum = parseFloat(parts[parts.length - 1]);
            if (Math.abs(checksum - (sum * 7)) > 0.1) return false;

            let numLevelsInSave = parsedVals.length - 3;

            saveData.bestLevels = Array(levels.length).fill(null);
            for(let i=0; i<Math.min(numLevelsInSave, levels.length); i++) {
                saveData.bestLevels[i] = parsedVals[i];
            }

            saveData.bestTutorial = parsedTutorial;

            if (numLevelsInSave === levels.length) {
                saveData.bestRTA = parsedVals[numLevelsInSave];
                saveData.bestIGT = parsedVals[numLevelsInSave + 1];
            } else {
                saveData.bestRTA = null;
                saveData.bestIGT = null;
            }

            storeSaveData();
            return true;
        } catch(e) {
            return false;
        }
    }

    window.addEventListener('click', e => {
        if (state === 'menu') {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const cx = (e.clientX - rect.left) * scaleX;
            const cy = (e.clientY - rect.top) * scaleY;

            if (menuScreen === 'main') {
                const buttons = [
                    { text: 'NEW GAME', type: 'play', y: 160 },
                    { text: 'CONTINUE', type: 'continue', y: 230 },
                    { text: 'PRACTICE', type: 'practice', y: 300 },
                    { text: 'TUTORIAL', type: 'tutorial', y: 370 },
                    { text: 'TIMES', type: 'times', y: 440 },
                    { text: 'SAVE', type: 'save', y: 510 },
                    { text: 'LOAD', type: 'load', y: 580 },
                    { text: 'SETTINGS', type: 'settings', y: 650 }
                ];

                buttons.forEach(b => {
                    if (cx > canvas.width/2 - 100 && cx < canvas.width/2 + 100 &&
                        cy > b.y && cy < b.y + 50) {
                        if (b.type === 'play') {
                            isPracticeMode = false;
                            currentLevelIndex = 0;
                            saveData.campaignProgress = 0;
                            saveData.casualRTA = 0;
                            saveData.casualIGT = 0;

                            currentRunIGT = 0;
                            hasMoved = false;
                            storeSaveData();
                            loadLevel(currentLevelIndex);
                        } else if (b.type === 'continue') {
                            let isContinueDisabled = isSpeedrunMode || saveData.campaignProgress === 0;
                            if (!isContinueDisabled) {
                                isPracticeMode = false;
                                currentLevelIndex = saveData.campaignProgress;
                                if (currentLevelIndex >= levels.length) currentLevelIndex = 0;
                                runInvalidated = true;
                                runState = 'active';
                                currentRunRTA = saveData.casualRTA || 0;
                                currentRunIGT = saveData.casualIGT || 0;
                                hasMoved = false;
                                loadLevel(currentLevelIndex);
                            }
                        } else if (b.type === 'practice') {
                            menuScreen = 'practice';
                            practicePage = 0;
                        } else if (b.type === 'tutorial') {
                            isPracticeMode = false;
                            loadLevel(-1);
                        } else if (b.type === 'times') {
                            menuScreen = 'times';
                            timesPage = 0;
                        } else if (b.type === 'save') {
                            menuScreen = 'save';
                            saveCopyStatus = "";
                            generatedSaveCode = generateSaveCode();
                        } else if (b.type === 'load') {
                            menuScreen = 'load';
                            loadInput = "";
                            loadStatus = "";
                        } else if (b.type === 'settings') {
                            menuScreen = 'settings';
                        }
                    }
                });
            } else if (menuScreen === 'practice') {
                const startIndex = practicePage * 10;
                const maxPracticePages = Math.ceil(levels.length / 10);

                for (let i = 0; i < 10; i++) {
                    let actualIndex = startIndex + i;
                    if (actualIndex >= levels.length) continue;

                    let col = i % 5;
                    let row = Math.floor(i / 5);
                    let bx = canvas.width/2 - 240 + col * 100;
                    let by = 260 + row * 100;

                    if (cx > bx && cx < bx + 80 && cy > by && cy < by + 80) {
                        isPracticeMode = true;
                        currentLevelIndex = actualIndex;
                        loadLevel(currentLevelIndex);
                        break;
                    }
                }

                let arrY = 460;
                if (practicePage > 0) {
                    let leftX = canvas.width / 2 - 380;
                    if (cx > leftX && cx < leftX + 120 && cy > arrY && cy < arrY + 40) {
                        practicePage--;
                    }
                }
                if (practicePage < maxPracticePages - 1) {
                    let rightX = canvas.width / 2 + 260;
                    if (cx > rightX && cx < rightX + 120 && cy > arrY && cy < arrY + 40) {
                        practicePage++;
                    }
                }

                if (cx > canvas.width/2 - 100 && cx < canvas.width/2 + 100 && cy > 550 && cy < 600) {
                    menuScreen = 'main';
                }
            } else if (menuScreen === 'times' || menuScreen === 'save' || menuScreen === 'load') {
                if (cx > canvas.width/2 - 100 && cx < canvas.width/2 + 100 && cy > 550 && cy < 600) {
                    menuScreen = 'main';
                    showTutorialTime = false;
                }

                if (menuScreen === 'times') {
                    const maxTimesPages = Math.ceil(levels.length / 10);
                    let arrY = 480;

                    let wordX = canvas.width / 2 - 400;
                    let wordY = 200;
                    if (cx > wordX && cx < wordX + 150 && cy > wordY && cy < wordY + 40) {
                        let now = Date.now();
                        individualClicks.push(now);
                        individualClicks = individualClicks.filter(t => now - t <= 3000);
                        if (individualClicks.length >= 3) {
                            showTutorialTime = true;
                            individualClicks = [];
                        }
                    }

                    if (timesPage > 0) {
                        let leftX = canvas.width / 2 - 400;
                        if (cx > leftX && cx < leftX + 120 && cy > arrY && cy < arrY + 40) {
                            timesPage--;
                        }
                    }
                    if (timesPage < maxTimesPages - 1) {
                        let rightX = canvas.width / 2 - 200;
                        if (cx > rightX && cx < rightX + 120 && cy > arrY && cy < arrY + 40) {
                            timesPage++;
                        }
                    }
                }

                if (menuScreen === 'save') {
                    if (cx > canvas.width/2 - 400 && cx < canvas.width/2 + 400 && cy > 250 && cy < 400) {
                        navigator.clipboard.writeText(generatedSaveCode).catch(err => {
                            let textArea = document.createElement("textarea");
                            textArea.value = generatedSaveCode;
                            document.body.appendChild(textArea);
                            textArea.select();
                            document.execCommand("Copy");
                            textArea.remove();
                        });
                        saveCopyStatus = "COPIED TO CLIPBOARD!";
                    }
                }
            } else if (menuScreen === 'settings') {
                if (cx > canvas.width/2 - 100 && cx < canvas.width/2 + 100 && cy > 600 && cy < 650) {
                    menuScreen = 'main';
                }

                let sLeft = canvas.width / 2 - 140;
                let sRight = canvas.width / 2 - 80;
                if (cx > sLeft && cx < sRight && cy > 130 && cy < 190) {
                    let now = Date.now();
                    if (now - lastSettingsClickTime > 1000) settingsHeaderClickCount = 0;
                    settingsHeaderClickCount++;
                    lastSettingsClickTime = now;
                    if (settingsHeaderClickCount >= 4) {
                        easterEggUnlocked = true;
                    }
                }

                let toggle1Y = 230;
                let toggle2Y = 300;
                let toggle3Y = 370;
                let toggle4Y = 440;
                let toggle5Y = 510;

                if (cx > canvas.width/2 - 250 && cx < canvas.width/2 + 250) {
                    if (cy > toggle1Y && cy < toggle1Y + 50) {
                        isSpeedrunMode = !isSpeedrunMode;
                        if (!isSpeedrunMode) {
                            runInvalidated = true;
                        } else {
                            cheatsEnabled = false;
                            customFinalLevel = null;
                            activeCheatPrefix = null;
                            cheatPrefixTimer = 0;
                        }
                    }

                    if (cy > toggle2Y && cy < toggle2Y + 50) {
                        saveData.saveFrequency = (saveData.saveFrequency === '10') ? 'level' : '10';
                        storeSaveData();
                    }

                    if (cy > toggle3Y && cy < toggle3Y + 50) {
                        saveData.visualEffects = (saveData.visualEffects === 'high') ? 'low' : 'high';
                        MAX_PARTICLES = saveData.visualEffects === 'high' ? 800 : 200;
                        particles = Array.from({ length: MAX_PARTICLES }, () => ({
                            active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, type: 'exhaust'
                        }));

                        storeSaveData();
                    }

                    if (cy > toggle4Y && cy < toggle4Y + 50) {
                        saveData.showTimer = !saveData.showTimer;
                        storeSaveData();
                    }

                    if (easterEggUnlocked && cy > toggle5Y && cy < toggle5Y + 50) {
                        allowTerminalInSpeedrun = !allowTerminalInSpeedrun;
                    }
                }
            }
        }

    window.addEventListener('keydown', e => {
        if (state === 'menu' && menuScreen === 'load') {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') return;

            e.preventDefault();
            if (e.key === 'Escape') {
                menuScreen = 'main';
            } else if (e.key === 'Enter') {
                let success = parseSaveCode(loadInput);
                if (success) {
                    loadStatus = "SUCCESS! DATA LOADED.";
                } else {
                    loadStatus = "CORRUPTED DATA.";
                }
            } else if (e.key === 'Backspace') {
                loadInput = loadInput.slice(0, -1);
                loadStatus = "";
            } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                loadInput += e.key;
                loadStatus = "";
            }
            return;
        }

        if (isPaused) {
            if (e.key === 'Enter') {
                isPaused = false;
                keys = {};
            }
            return;
        }

        if (terminalActive) {
            e.preventDefault();
            if (e.key === 'Escape') {
                terminalActive = false;
            } else if (e.key === 'Enter') {
                const cmd = terminalInput.trim().toLowerCase();
                if (cmd === 'sudo cheat = true' || cmd === 'sudo cheats = true') {
                    cheatsEnabled = true;
                    runInvalidated = true;
                } else if (cmd === 'sudo cheat = false' || cmd === 'sudo cheats = false') {
                    cheatsEnabled = false;
                } else if (cmd.startsWith('sudo final_level =')) {
                    const val = cmd.split('=')[1].trim();
                    if (val === 'default' || val === 'reset') {
                        customFinalLevel = null;
                    } else {
                        const parsed = parseInt(val, 10);
                        if (!isNaN(parsed) && parsed > 0 && parsed <= levels.length) {
                            customFinalLevel = parsed - 1;
                            runInvalidated = true;
                        }
                    }
                } else if (cmd.startsWith('sudo reset_level =')) {
                    const val = cmd.split('=')[1].trim();
                    if (val === 'tutorial') {
                        saveData.bestTutorial = null;
                        storeSaveData();
                    } else {
                        const parsed = parseInt(val, 10);
                        if (!isNaN(parsed) && parsed > 0 && parsed <= levels.length) {
                            saveData.bestLevels[parsed - 1] = null;
                            storeSaveData();
                        }
                    }
                }
                terminalActive = false;
            } else if (e.key === 'Backspace') {
                terminalInput = terminalInput.slice(0, -1);
            } else if (e.key.length === 1) {
                terminalInput += e.key;
            }
            return;
        }

        const key = e.key.toLowerCase();
        keys[key] = true;

        if (key === 'escape' && state === 'victory') {
            goToMenu();
            return;
        }

        if (key === 'r') {
            if (state !== 'menu' && state !== 'victory') {
                if (currentLevelIndex === 0 && runState === 'active' && !runInvalidated) {
                    runState = 'inactive';
                }
                loadLevel(currentLevel?.isTutorial ? -1 : currentLevelIndex);
            }
        }

        if (cheatsEnabled) {
            if (['y', 'u', 'i', 'o', 'p'].includes(key)) {
                activeCheatPrefix = key;
                cheatPrefixTimer = 120;
            }

            if (['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'].includes(key)) {
                runState = 'inactive';

                let base = 0;
                if (activeCheatPrefix === 'u') base = 10;
                else if (activeCheatPrefix === 'i') base = 20;
                else if (activeCheatPrefix === 'o') base = 30;
                else if (activeCheatPrefix === 'p') base = 40;

                let numValue = key === '0' ? 10 : parseInt(key, 10);
                let targetIndex = base + numValue - 1;

                if (targetIndex >= 0 && targetIndex < levels.length) {
                    currentLevelIndex = targetIndex;
                    loadLevel(currentLevelIndex);
                }
                activeCheatPrefix = null;
            }
        }

        if (state === 'won' && key === 'enter') {
            let targetFinalIndex = customFinalLevel !== null ? customFinalLevel : levels.length - 1;
            if (currentLevel.isTutorial) {
                return;
            } else if (isPracticeMode) {
                loadLevel(currentLevelIndex);
            } else if (currentLevelIndex < targetFinalIndex) {
                currentLevelIndex++;
                loadLevel(currentLevelIndex);
            } else {
                goToMenu();
            }
        }
    });

    window.addEventListener('keyup', e => {
        const key = e.key.toLowerCase();

        if (key === 't') {
            if (!terminalActive && state === 'menu' && menuScreen === 'main' && !tTriggeredReset) {

                } else {
                    terminalActive = true;
                    terminalInput = "";
                    keys = {};
                }
            }
            tHoldTimer = 0;
            tTriggeredReset = false;
        }
    });

    function generateParallax(themeType, width, height) {
        parallaxLayers = [];
        if (!themeType) return;

        const loopW = 4000;

        let layer1 = { speed: 0.2, shapes: [], color: currentLevel.theme.l1, loopWidth: loopW };
        let layer2 = { speed: 0.5, shapes: [], color: currentLevel.theme.l2, loopWidth: loopW };

        if (themeType === 'mountains' || themeType === 'foggy-mountains') {
            for(let x = 0; x < loopW; x += Math.random() * 200 + 100) {
                layer1.shapes.push({ type: 'peak', x: x, y: height + 200, w: Math.random() * 400 + 300, h: Math.random() * 600 + 400 });
            }
            for(let x = 0; x < loopW; x += Math.random() * 150 + 100) {
                layer2.shapes.push({ type: 'peak', x: x, y: height + 100, w: Math.random() * 300 + 200, h: Math.random() * 400 + 300 });
            }
        } else if (themeType === 'machinery' || themeType === 'caves') {
            for(let x = 0; x < loopW; x += Math.random() * 300 + 100) {
                for(let y = -500; y < height + 500; y += Math.random() * 400 + 200) {
                    layer1.shapes.push({ type: 'rect', x: x, y: y, w: Math.random() * 150 + 50, h: Math.random() * 500 + 200 });
                }
            }
            for(let x = 0; x < loopW; x += Math.random() * 200 + 100) {
                for(let y = -500; y < height + 500; y += Math.random() * 300 + 150) {
                    layer2.shapes.push({ type: 'rect', x: x, y: y, w: Math.random() * 100 + 40, h: Math.random() * 300 + 100 });
                }
            }
        } else if (themeType === 'stars') {
            for(let i = 0; i < 300; i++) {
                layer1.shapes.push({ type: 'star', x: Math.random() * loopW, y: Math.random() * height, r: Math.random() * 1.5 + 0.5 });
            }
            for(let i = 0; i < 200; i++) {
                layer2.shapes.push({ type: 'star', x: Math.random() * loopW, y: Math.random() * height, r: Math.random() * 1.0 });
            }
        }
        parallaxLayers.push(layer1, layer2);
    }

    function goToMenu() {
        if (runState === 'active' && !isPracticeMode) {
            saveData.casualRTA = currentRunRTA;
            saveData.casualIGT = currentRunIGT;
            storeSaveData();
        }

        state = 'menu';
        menuScreen = 'main';
        activeEvent = null;
        currentMinigame = null;
        restorePhysics();
        isPracticeMode = false;
        runState = 'inactive';
        currentLevel = levels[0];
        generateParallax(currentLevel.theme?.parallaxType, currentLevel.width, currentLevel.height);
        camera = { x: 0, y: 0 };
        transitionAlpha = 1.0;
        escHoldTimer = 0;
        tHoldTimer = 0;
        tTriggeredReset = false;
        showTutorialTime = false;
        menuShip.active = false;
        menuShip.timer = 60;
        ambientDust = Array.from({length: 120}, () => ({
            x: camera.x + Math.random() * canvas.width,
            y: camera.y + Math.random() * canvas.height,
            baseVx: (Math.random() - 0.5) * 0.5,
            baseVy: (Math.random() - 0.5) * 0.5
        }));

        particles = Array.from({ length: MAX_PARTICLES }, () => ({
            active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, type: 'exhaust'
        }));
        particleIndex = 0;
    }

    // --- SAT BOOLEAN COLLISION CHECKER ---
    function testCirclePolygon(circle, poly) {
        for (let i = 0; i < poly.normals.length; i++) {
            let axis = poly.normals[i];
            let res = getOverlap(circle, poly, axis);
            if (!res.intersect) return false;
        }

        let closestVertex = null;
        let minSqDist = Infinity;
        for (let i = 0; i < poly.vertices.length; i++) {
            let v = poly.vertices[i];
            let dx = circle.x - v.x;
            let dy = circle.y - v.y;
            let sqDist = dx * dx + dy * dy;
            if (sqDist < minSqDist) {
                minSqDist = sqDist;
                closestVertex = v;
            }
        }

        let axisX = circle.x - closestVertex.x;
        let axisY = circle.y - closestVertex.y;
        let len = Math.sqrt(axisX * axisX + axisY * axisY);
        if (len > 0) {
            let cvAxis = { x: axisX / len, y: axisY / len };
            let res = getOverlap(circle, poly, cvAxis);
            if (!res.intersect) return false;
        }

        return true;
    }

    function getOverlap(circle, poly, axis) {
        let minP = Infinity, maxP = -Infinity;
        for (let i = 0; i < poly.vertices.length; i++) {
            let proj = poly.vertices[i].x * axis.x + poly.vertices[i].y * axis.y;
            minP = Math.min(minP, proj);
            maxP = Math.max(maxP, proj);
        }
        let cProj = circle.x * axis.x + circle.y * axis.y;
        let minC = cProj - circle.r;
        let maxC = cProj + circle.r;

        if (minP > maxC || minC > maxP) return { intersect: false };
        return { intersect: true };
    }

    // Pillar 4: Public function to trigger Event Obstacles
    function triggerEvent(id) {
        for (let obs of obstacles) {
            if (obs.isTriggered && obs.id === id) {
                obs.isOpen = true;
            }
        }
    }

    function getFacingAngle(facing) {
        if (facing === 'right') return Math.PI / 2;
        if (facing === 'down') return Math.PI;
        if (facing === 'left') return -Math.PI / 2;
        return 0; // 'up' is default
    }

    function loadLevel(index) {
        let sourceLevel = index === -1 ? tutorialLevel : levels[index];

        // Deep clone the level so mutable changes don't persist across restarts
        currentLevel = JSON.parse(JSON.stringify(sourceLevel));

        obstacles = currentLevel.obstacles.map(obs => {
            let vertices = obs.vertices;
            if (!vertices && obs.w !== undefined && obs.h !== undefined) {
                vertices = [
                    { x: obs.x, y: obs.y },
                    { x: obs.x + obs.w, y: obs.y },
                    { x: obs.x + obs.w, y: obs.y + obs.h },
                    { x: obs.x, y: obs.y + obs.h }
                ];
            }

            let normals = [];
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

            for (let i = 0; i < vertices.length; i++) {
                let p1 = vertices[i];
                let p2 = vertices[(i + 1) % vertices.length];

                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                let len = Math.sqrt(dx * dx + dy * dy);
                normals.push({ x: dy / len, y: -dx / len });

                minX = Math.min(minX, p1.x);
                maxX = Math.max(maxX, p1.x);
                minY = Math.min(minY, p1.y);
                maxY = Math.max(maxY, p1.y);
            }

            return {
                ...obs,
                vertices,
                normals,
                aabb: { minX, maxX, minY, maxY }
            };
        });

        // --- LOAD DETERMINISTIC MOVING OBSTACLES ---
        if (currentLevel.movingObstacles) {
            let movingObs = currentLevel.movingObstacles.map(obs => {
                let phase = (1 - Math.cos(0 * obs.speed)) / 2;
                let cx = obs.startX + (obs.endX - obs.startX) * phase;
                let cy = obs.startY + (obs.endY - obs.startY) * phase;

                let vertices = [
                    { x: cx, y: cy },
                    { x: cx + obs.w, y: cy },
                    { x: cx + obs.w, y: cy + obs.h },
                    { x: cx, y: cy + obs.h }
                ];

                let normals = [];
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

                for (let i = 0; i < vertices.length; i++) {
                    let p1 = vertices[i];
                    let p2 = vertices[(i + 1) % vertices.length];
                    let dx = p2.x - p1.x;
                    let dy = p2.y - p1.y;
                    let len = Math.sqrt(dx * dx + dy * dy);
                    normals.push({ x: dy / len, y: -dx / len });

                    minX = Math.min(minX, p1.x);
                    maxX = Math.max(maxX, p1.x);
                    minY = Math.min(minY, p1.y);
                    maxY = Math.max(maxY, p1.y);
                }

                return {
                    ...obs,
                    isMoving: true,
                    vertices,
                    normals,
                    aabb: { minX, maxX, minY, maxY }
                };
            });
            obstacles = obstacles.concat(movingObs);
        }

        // --- LOAD DETERMINISTIC ROTATING OBSTACLES ---
        if (currentLevel.rotatingObstacles) {
            let rotObs = currentLevel.rotatingObstacles.map(obs => {
                let baseVerts = obs.baseVertices;
                if (!baseVerts && obs.w !== undefined && obs.h !== undefined) {
                    baseVerts = [
                        { x: -obs.w/2, y: -obs.h/2 },
                        { x: obs.w/2, y: -obs.h/2 },
                        { x: obs.w/2, y: obs.h/2 },
                        { x: -obs.w/2, y: obs.h/2 }
                    ];
                }

                let angle = 0;
                if (obs.initialAngle) angle += obs.initialAngle;
                let cos = Math.cos(angle);
                let sin = Math.sin(angle);

                let vertices = baseVerts.map(v => {
                    return {
                        x: obs.cx + (v.x * cos - v.y * sin),
                        y: obs.cy + (v.x * sin + v.y * cos)
                    };
                });

                let normals = [];
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (let i = 0; i < vertices.length; i++) {
                    let p1 = vertices[i];
                    let p2 = vertices[(i + 1) % vertices.length];
                    let dx = p2.x - p1.x;
                    let dy = p2.y - p1.y;
                    let len = Math.sqrt(dx * dx + dy * dy);
                    normals.push({ x: dy / len, y: -dx / len });
                    minX = Math.min(minX, p1.x);
                    maxX = Math.max(maxX, p1.x);
                    minY = Math.min(minY, p1.y);
                    maxY = Math.max(maxY, p1.y);
                }

                return {
                    ...obs,
                    isRotating: true,
                    baseVertices: baseVerts,
                    vertices,
                    normals,
                    aabb: { minX, maxX, minY, maxY }
                };
            });
            obstacles = obstacles.concat(rotObs);
        }

        // --- LOAD TRIGGERED OBSTACLES (PILLAR 4) ---
        if (currentLevel.triggerObstacles) {
            let trigObs = currentLevel.triggerObstacles.map(obs => {
                let cx = obs.startX;
                let cy = obs.startY;

                let vertices = [
                    { x: cx, y: cy },
                    { x: cx + obs.w, y: cy },
                    { x: cx + obs.w, y: cy + obs.h },
                    { x: cx, y: cy + obs.h }
                ];

                let normals = [];
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

                for (let i = 0; i < vertices.length; i++) {
                    let p1 = vertices[i];
                    let p2 = vertices[(i + 1) % vertices.length];
                    let dx = p2.x - p1.x;
                    let dy = p2.y - p1.y;
                    let len = Math.sqrt(dx * dx + dy * dy);
                    normals.push({ x: dy / len, y: -dx / len });

                    minX = Math.min(minX, p1.x);
                    maxX = Math.max(maxX, p1.x);
                    minY = Math.min(minY, p1.y);
                    maxY = Math.max(maxY, p1.y);
                }

                return {
                    ...obs,
                    isTriggered: true,
                    isOpen: obs.isOpen || false,
                    progress: obs.isOpen ? 1.0 : 0.0,
                    vertices,
                    normals,
                    aabb: { minX, maxX, minY, maxY }
                };
            });
            obstacles = obstacles.concat(trigObs);
        }

        // --- PREPARE LEVEL ZONES (Wind, EMP, Boost, Portals) ---
        activeZones = [];
        if (currentLevel.zones) {
            activeZones = currentLevel.zones.map(z => ({ ...z, playerInside: false }));
        }

        // --- LOAD COLLECTIBLES / FUEL ITEMS ---
        activeItems = [];
        if (currentLevel.items) {
            activeItems = JSON.parse(JSON.stringify(currentLevel.items));
        }

        player = {
            x: currentLevel.startX,
            y: currentLevel.startY,
            vx: 0, vy: 0, angle: 0, w: 20, h: 30,
            fuel: currentLevel.fuelCapacity || Infinity,
            maxFuel: currentLevel.fuelCapacity || Infinity,
            portalCooldown: 0
        };

        camera.x = Math.max(0, Math.min(player.x - canvas.width / 2, currentLevel.width - canvas.width));
        camera.y = Math.max(0, Math.min(player.y - canvas.height / 2, currentLevel.height - canvas.height));

        generateParallax(currentLevel.theme?.parallaxType, currentLevel.width, currentLevel.height);

        ambientDust = Array.from({length: 120}, () => ({
            x: camera.x + Math.random() * canvas.width,
            y: camera.y + Math.random() * canvas.height,
            baseVx: (Math.random() - 0.5) * 0.5,
            baseVy: (Math.random() - 0.5) * 0.5
        }));

        particles = Array.from({ length: MAX_PARTICLES }, () => ({
            active: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, type: 'exhaust'
        }));
        particleIndex = 0;

        state = 'playing';
        activeEvent = null;
        currentMinigame = null;
        restorePhysics();
        hasMoved = false;
        empActive = false;
        exhaustTimer = 1.0;
        timer = 0;
        timerRunning = false;
        thrusterFlicker = 0;
        transitionAlpha = 1.0;
        escHoldTimer = 0;
        tHoldTimer = 0;
        tTriggeredReset = false;
    }

    function getParticle() {
        const p = particles[particleIndex];
        particleIndex = (particleIndex + 1) % MAX_PARTICLES;
        return p;
    }

    function spawnExhaustParticles() {
        const count = Math.floor(Math.random() * 3) + 3;
        const baseX = player.x - Math.sin(player.angle) * (player.h / 2);
        const baseY = player.y + Math.cos(player.angle) * (player.h / 2);

        for (let i = 0; i < count; i++) {
            let p = getParticle();
            if(p) {
                p.active = true;
                p.x = baseX + (Math.random() - 0.5) * 4;
                p.y = baseY + (Math.random() - 0.5) * 4;
                p.vx = player.vx + (Math.random() - 0.5) * 3 - Math.sin(player.angle) * 4;
                p.vy = player.vy + (Math.random() - 0.5) * 3 + Math.cos(player.angle) * 4;
                p.life = 1.0;
                p.type = 'exhaust';
            }
        }
    }

    function spawnExplosion(x, y) {
        for (let i = 0; i < 40; i++) {
            let p = getParticle();
            if(p) {
                p.active = true;
                p.x = x;
                p.y = y;
                p.vx = (Math.random() - 0.5) * 12;
                p.vy = (Math.random() - 0.5) * 12;
                p.life = 1.0;
                p.type = 'explosion';
            }
        }
    }

    function spawnSparks(x, y) {
        for (let i = 0; i < 15; i++) {
            let p = getParticle();
            if(p) {
                p.active = true;
                p.x = x;
                p.y = y;
                p.vx = (Math.random() - 0.5) * 6;
                p.vy = (Math.random() - 0.5) * 6;
                p.life = 0.6;
                p.type = 'spark';
            }
        }
    }

    function spawnLandingDust(x, y) {
        for (let i = 0; i < 30; i++) {
            let p = getParticle();
            if(p) {
                p.active = true;
                p.x = x + (Math.random() - 0.5) * 30;
                p.y = y + 8 + (Math.random() * 4);
                p.vx = (Math.random() - 0.5) * 6;
                p.vy = -Math.random() * 1 - 0.2;
                p.life = 0.8 + Math.random() * 0.4;
                p.type = 'exhaust';
            }
        }
    }

    function getNormalizedAngle() {
        let normAngle = player.angle % (Math.PI * 2);
        if (normAngle > Math.PI) normAngle -= Math.PI * 2;
        if (normAngle < -Math.PI) normAngle += Math.PI * 2;
        return normAngle;
    }

    function updateCamera() {
        let leadX = player.vx * 5;
        let leadY = player.vy * 8;

        leadX = Math.max(-100, Math.min(100, leadX));
        leadY = Math.max(-100, Math.min(150, leadY));

        let targetX = player.x - canvas.width / 2 + leadX;
        let targetY = player.y - canvas.height / 2 + leadY;

        targetX = Math.max(0, Math.min(targetX, currentLevel.width - canvas.width));
        targetY = Math.max(0, Math.min(targetY, currentLevel.height - canvas.height));

        camera.x += (targetX - camera.x) * 0.15;
        camera.y += (targetY - camera.y) * 0.15;
    }

    // --- MINIGAME MODULAR REGISTRY ---
    let currentMinigame = null;
    let minigameData = {};

    const MINIGAME_REGISTRY = {
        'hack_door': {
            init: function(data, pad) {
                data.pad = pad;
                data.sliderX = 0;
                data.direction = 1;
                data.speed = 600; // Very fast
                data.targetMin = 375; // The sweet spot
                data.targetMax = 425;
                data.width = 800;
                data.status = 'playing'; // 'playing', 'won', 'lost'
                data.message = "SYSTEM LOCK. PRESS [ENTER] IN THE GREEN ZONE.";
            },
            update: function(dt, data) {
                if (data.status !== 'playing') {
                    if (keys['enter']) {
                        state = 'playing'; // Return to main game
                        currentMinigame = null;
                        activeEvent = null;
                        restorePhysics();
                        keys['enter'] = false;
                    }
                    return;
                }

                // Move slider
                data.sliderX += data.direction * data.speed * (dt / 60);

                // Bounce off edges
                if (data.sliderX > data.width) {
                    data.sliderX = data.width;
                    data.direction = -1;
                } else if (data.sliderX < 0) {
                    data.sliderX = 0;
                    data.direction = 1;
                }

                // Lock in result
                if (keys['enter']) {
                    keys['enter'] = false;
                    if (data.sliderX >= data.targetMin && data.sliderX <= data.targetMax) {
                        data.status = 'won';
                        data.message = "OVERRIDE SUCCESSFUL. BLAST DOOR OPENED.";
                        triggerEvent('boss_door'); // Triggers the door slide
                        if (data.pad) {
                            data.pad.event = null; // Permanently clear the event
                        }
                    } else {
                        data.status = 'lost';
                        data.message = "OVERRIDE FAILED. PRESS [ENTER] TO RETRY.";
                    }
                }
            },
            draw: function(ctx, data) {
                ctx.fillStyle = 'rgba(0, 5, 10, 0.9)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const cx = canvas.width / 2;
                const cy = canvas.height / 2;

                ctx.textAlign = 'center';
                ctx.font = 'bold 36px monospace';
                ctx.shadowBlur = 10;

                if (data.status === 'playing') {
                    ctx.fillStyle = '#0ff'; ctx.shadowColor = '#0ff';
                } else if (data.status === 'won') {
                    ctx.fillStyle = '#0f0'; ctx.shadowColor = '#0f0';
                } else {
                    ctx.fillStyle = '#f00'; ctx.shadowColor = '#f00';
                }

                ctx.fillText("TERMINAL HACK OVERRIDE", cx, cy - 100);
                ctx.font = '18px monospace';
                ctx.fillText(data.message, cx, cy - 50);
                ctx.shadowBlur = 0;

                // Draw Bar Background
                const barX = cx - data.width / 2;
                const barY = cy;
                ctx.fillStyle = '#111';
                ctx.fillRect(barX, barY, data.width, 40);
                ctx.strokeStyle = '#333';
                ctx.strokeRect(barX, barY, data.width, 40);

                // Draw Sweet Spot (Green Zone)
                ctx.fillStyle = 'rgba(0, 255, 0, 0.4)';
                ctx.fillRect(barX + data.targetMin, barY, data.targetMax - data.targetMin, 40);

                // Draw Slider
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#fff';
                ctx.fillRect(barX + data.sliderX - 5, barY - 10, 10, 60);
                ctx.shadowBlur = 0;
            }
        }
    };

    // --- UNIVERSAL MINIGAME HANDLERS ---
    function updateMinigame(dt) {
        if (keys['escape']) {
            state = 'playing';
            currentMinigame = null;
            activeEvent = null;
            restorePhysics();
            keys['escape'] = false;
            escHoldTimer = 0;

            // Bump player off pad to prevent instant re-trigger
            player.y -= 5;
            player.vy = -2;
            return;
        }

        // Keep the level timer ticking to penalize slow hacking!
        if (timerRunning) {
            timer += dt / 60;

            // Continue updating moving/rotating obstacles so they don't teleport when exiting
            for (let obs of obstacles) {
                if (obs.isMoving) {
                    let phase = (1 - Math.cos(timer * obs.speed)) / 2;
                    let cx = obs.startX + (obs.endX - obs.startX) * phase;
                    let cy = obs.startY + (obs.endY - obs.startY) * phase;
                    obs.vertices = [
                        { x: cx, y: cy },
                        { x: cx + obs.w, y: cy },
                        { x: cx + obs.w, y: cy + obs.h },
                        { x: cx, y: cy + obs.h }
                    ];
                } else if (obs.isRotating) {
                    let angle = timer * obs.speed;
                    if (obs.initialAngle) angle += obs.initialAngle;
                    let cosA = Math.cos(angle);
                    let sinA = Math.sin(angle);
                    obs.vertices = obs.baseVertices.map(v => {
                        return {
                            x: obs.cx + (v.x * cosA - v.y * sinA),
                            y: obs.cy + (v.x * sinA + v.y * cosA)
                        };
                    });
                }
            }
        }

        if (currentMinigame && MINIGAME_REGISTRY[currentMinigame]) {
            MINIGAME_REGISTRY[currentMinigame].update(dt, minigameData);
        }
    }

    function drawMinigame() {
        if (currentMinigame && MINIGAME_REGISTRY[currentMinigame]) {
            MINIGAME_REGISTRY[currentMinigame].draw(ctx, minigameData);
        }
    }

    function update(dt) {
        if (isPaused) return;

        if (transitionAlpha > 0) {
            transitionAlpha -= dt * 0.03;
            if (transitionAlpha < 0) transitionAlpha = 0;
        }

        if (cheatPrefixTimer > 0) {
            cheatPrefixTimer -= dt;
            if (cheatPrefixTimer <= 0) activeCheatPrefix = null;
        }

        if (state === 'menu') {
            camera.x += 1 * dt;

            if (!menuShip.active) {
                menuShip.timer -= dt;
                if (menuShip.timer <= 0) {
                    menuShip.active = true;
                    let fromLeft = Math.random() > 0.5;
                    menuShip.direction = fromLeft ? 1 : -1;

                    menuShip.x = camera.x + (fromLeft ? -100 : canvas.width + 100);
                    menuShip.y = camera.y + 100 + Math.random() * (canvas.height - 200);

                    menuShip.vx = menuShip.direction * (Math.random() * 5 + 4);

                    if (menuShip.y < camera.y + canvas.height / 2) {
                        menuShip.vy = Math.random() * 2 + 1;
                    } else {
                        menuShip.vy = -Math.random() * 4 - 2;
                    }

                    menuShip.angle = Math.atan2(menuShip.vx, -menuShip.vy);

                    menuShip.actionTimer = 0;
                    menuShip.timer = Math.random() * 400 + 300;
                }
            } else {
                menuShip.actionTimer -= dt;
                if (menuShip.actionTimer <= 0) {
                    let r = Math.random();
                    if (r < 0.35) {
                        menuShip.maneuver = 'boost';
                        menuShip.actionTimer = 60 + Math.random() * 80;
                    } else if (r < 0.60) {
                        menuShip.maneuver = 'climb';
                        menuShip.actionTimer = 50 + Math.random() * 60;
                    } else if (r < 0.80) {
                        menuShip.maneuver = 'dive';
                        menuShip.actionTimer = 50 + Math.random() * 60;
                    } else {
                        menuShip.maneuver = 'coast';
                        menuShip.actionTimer = 40 + Math.random() * 60;
                    }
                }

                let targetAngle = menuShip.angle;
                menuShip.physicsThrust = 0;
                menuShip.visualThrust = 0;

                if (menuShip.maneuver === 'boost') {
                    targetAngle = menuShip.direction * (Math.PI / 2.2);
                    menuShip.physicsThrust = Math.random() > 0.3 ? 1.0 : 0.0;
                    menuShip.visualThrust = 1.0;
                } else if (menuShip.maneuver === 'climb') {
                    targetAngle = menuShip.direction * (Math.PI / 4);
                    menuShip.physicsThrust = Math.random() > 0.1 ? 1.0 : 0.0;
                    menuShip.visualThrust = 1.0;
                } else if (menuShip.maneuver === 'dive') {
                    targetAngle = menuShip.direction * (Math.PI * 0.6);
                    menuShip.physicsThrust = Math.random() > 0.5 ? 1.0 : 0.0;
                    menuShip.visualThrust = 1.0;
                } else {
                    targetAngle = Math.atan2(menuShip.vx, -menuShip.vy);
                }

                let diff = targetAngle - menuShip.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                menuShip.angle += diff * 0.05 * dt;

                if (menuShip.physicsThrust > 0) {
                    menuShip.vx += Math.sin(menuShip.angle) * THRUST * 1.2 * dt;
                    menuShip.vy -= Math.cos(menuShip.angle) * THRUST * 1.2 * dt;
                }

                menuShip.vy += GRAVITY * dt;
                menuShip.x += menuShip.vx * dt;
                menuShip.y += menuShip.vy * dt;

                if (menuShip.physicsThrust > 0) {
                    const count = Math.floor(Math.random() * 2) + 1;
                    const baseX = menuShip.x - Math.sin(menuShip.angle) * (menuShip.h / 2);
                    const baseY = menuShip.y + Math.cos(menuShip.angle) * (menuShip.h / 2);

                    for (let i = 0; i < count; i++) {
                        let p = getParticle();
                        if (p) {
                            p.active = true;
                            p.x = baseX + (Math.random() - 0.5) * 4;
                            p.y = baseY + (Math.random() - 0.5) * 4;
                            p.vx = menuShip.vx * 0.3 + (Math.random() - 0.5) * 2 - Math.sin(menuShip.angle) * 3;
                            p.vy = menuShip.vy * 0.3 + (Math.random() - 0.5) * 2 + Math.cos(menuShip.angle) * 3;
                            p.life = 0.8;
                            p.type = 'exhaust';
                        }
                    }
                }

                if (menuShip.x > camera.x + canvas.width + 500 ||
                    menuShip.x < camera.x - 500 ||
                    menuShip.y > camera.y + canvas.height + 500) {
                    menuShip.active = false;
                }
            }

        } else {
            if (keys['escape'] && state !== 'victory') {
                escHoldTimer += dt / 60;
                if (escHoldTimer >= 1.0) {
                    goToMenu();
                    keys['escape'] = false;
                    return;
                }
            } else {
                escHoldTimer = 0;
            }

            if (keys['t']) {
                if (isSpeedrunMode && !isPracticeMode) {
                    tHoldTimer += dt / 60;
                    if (tHoldTimer >= 0.5 && !tTriggeredReset) {
                        tTriggeredReset = true;
                        runState = 'active';
                        currentRunRTA = 0;
                        currentRunIGT = 0;
                        rtaSaveTimer = 0;
                        saveData.casualRTA = 0;
                        saveData.casualIGT = 0;
                        saveData.campaignProgress = 0;
                        storeSaveData();
                        hasMoved = false;
                        currentLevelIndex = 0;
                        runInvalidated = false;
                        loadLevel(0);
                        keys['t'] = false;
                    }
                }
            }

            if (state === 'won' || state === 'victory') {
                player.vx = 0;
                player.vy = 0;
                player.angle = 0;
            }

            if (state === 'playing') {
                empActive = false; // Reset EMP status every frame

                if (player.portalCooldown > 0) {
                    player.portalCooldown -= dt / 60;
                }

                let willMove = (keys['a'] || keys['arrowleft'] || keys['d'] || keys['arrowright'] || keys['w'] || keys['arrowup']);

                if (willMove && !hasMoved) {
                    hasMoved = true;
                    if (!isSpeedrunMode) runInvalidated = true;
                    if (currentLevelIndex === 0 && !isPracticeMode && !currentLevel.isTutorial && runState === 'inactive') {
                        runState = 'active';
                        currentRunRTA = 0;
                        currentRunIGT = 0;
                    }
                }

                // Process Active Area of Effect Zones BEFORE input
                if (activeZones.length > 0) {
                    for (let zone of activeZones) {
                        let inside = player.x > zone.x && player.x < zone.x + zone.w &&
                            player.y > zone.y && player.y < zone.y + zone.h;

                        if (inside) {
                            if (zone.type === 'emp') {
                                empActive = true;
                            } else if (zone.type === 'boost') {
                                if (!zone.playerInside) {
                                    player.vx *= (zone.multX !== undefined ? zone.multX : 1);
                                    player.vy *= (zone.multY !== undefined ? zone.multY : 1);
                                    zone.playerInside = true;
                                    spawnSparks(player.x, player.y);
                                }
                            } else if (zone.type === 'portal') {
                                if (player.portalCooldown <= 0) {
                                    let targetZone = activeZones.find(z => z.id === zone.targetId);
                                    if (targetZone) {
                                        spawnSparks(player.x, player.y); // Entry sparks

                                        // --- DIRECTIONAL PORTAL LOGIC ---
                                        let angleA = getFacingAngle(zone.facing || 'up');
                                        let angleB = getFacingAngle(targetZone.facing || 'up');
                                        let rotation = angleB - angleA + Math.PI;

                                        // Rotate visual angle
                                        player.angle += rotation;

                                        // Rotate momentum
                                        let speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
                                        let currentVelAngle = Math.atan2(player.vx, -player.vy);
                                        let newVelAngle = currentVelAngle + rotation;

                                        player.vx = Math.sin(newVelAngle) * speed;
                                        player.vy = -Math.cos(newVelAngle) * speed;

                                        // Teleport with slight offset to avoid getting stuck in the wall
                                        player.x = targetZone.x + targetZone.w / 2 + Math.sin(angleB) * 15;
                                        player.y = targetZone.y + targetZone.h / 2 - Math.cos(angleB) * 15;

                                        player.portalCooldown = 0.5;
                                        spawnSparks(player.x, player.y); // Exit sparks
                                    }
                                }
                            } else {
                                // Default wind/gravity logic
                                player.vx += (zone.forceX || 0) * dt;
                                player.vy += (zone.forceY || 0) * dt;
                            }
                        } else {
                            if (zone.type === 'boost') {
                                zone.playerInside = false;
                            }
                        }
                    }
                }

                // Rotation is preserved even in EMP
                if (keys['a'] || keys['arrowleft']) { player.angle -= ROTATION_SPEED * dt; }
                if (keys['d'] || keys['arrowright']) { player.angle += ROTATION_SPEED * dt; }

                // Main Thruster is disabled inside an EMP AND when out of fuel
                if (keys['w'] || keys['arrowup']) {
                    if (!empActive && player.fuel > 0) {
                        player.vx += Math.sin(player.angle) * THRUST * dt;
                        player.vy -= Math.cos(player.angle) * THRUST * dt;

                        // Handle limited fuel drainage
                        if (player.maxFuel !== Infinity) {
                            player.fuel -= 25 * (dt / 60); // Costs 25 fuel units per second
                            if (player.fuel < 0) player.fuel = 0;
                        }

                        thrusterFlicker = Math.min(1.0, thrusterFlicker + 0.1 * dt);

                        exhaustTimer += dt;
                        if (exhaustTimer >= 1.0) {
                            spawnExhaustParticles();
                            exhaustTimer = 0;
                        }
                    } else {
                        thrusterFlicker = Math.max(0, thrusterFlicker - 0.1 * dt);
                    }
                } else {
                    thrusterFlicker = Math.max(0, thrusterFlicker - 0.05 * dt);
                    exhaustTimer = 1.0;
                }

                if (!currentLevel.zeroGravity) {
                    player.vy += GRAVITY * dt;
                }

                player.x += player.vx * dt;
                player.y += player.vy * dt;

                const shipRadius = 12;

                // Process Items (Keys and Fuel Canisters)
                if (activeItems.length > 0) {
                    for (let item of activeItems) {
                        if (!item.collected) {
                            let dx = player.x - item.x;
                            let dy = player.y - item.y;
                            let dist = Math.sqrt(dx*dx + dy*dy);
                            let hitDist = shipRadius + (item.radius || 15);

                            if (dist < hitDist) {
                                item.collected = true;
                                spawnSparks(item.x, item.y);

                                if (item.type === 'key') {
                                    let allKeysCollected = activeItems.every(i => i.type !== 'key' || i.targetEvent !== item.targetEvent || i.collected);
                                    if (allKeysCollected) {
                                        triggerEvent(item.targetEvent);
                                    }
                                } else if (item.type === 'fuel') {
                                    if (player.fuel !== Infinity) {
                                        player.fuel = Math.min(player.maxFuel, player.fuel + (item.amount || 25));
                                    }
                                }
                            }
                        }
                    }
                }

                let crashedThisFrame = false;
                let speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);

                // --- 1. LEVEL BORDERS (Bounce vs Crash) ---
                if (player.x - shipRadius < 0) {
                    player.x = shipRadius;
                    if (player.vx < 0) {
                        if (speed > 15.0) crashedThisFrame = true;
                        else { player.vx *= -0.3; spawnSparks(player.x - shipRadius, player.y); }
                    }
                } else if (player.x + shipRadius > currentLevel.width) {
                    player.x = currentLevel.width - shipRadius;
                    if (player.vx > 0) {
                        if (speed > 15.0) crashedThisFrame = true;
                        else { player.vx *= -0.3; spawnSparks(player.x + shipRadius, player.y); }
                    }
                }

                if (player.y - shipRadius < 0) {
                    player.y = shipRadius;
                    if (player.vy < 0) {
                        if (speed > 15.0) crashedThisFrame = true;
                        else { player.vy *= -0.3; spawnSparks(player.x, player.y - shipRadius); }
                    }
                }

                let cos = Math.cos(player.angle);
                let sin = Math.sin(player.angle);

                let p1x = player.x + (player.h / 2) * sin;
                let p1y = player.y + (-player.h / 2) * cos;
                let p2x = player.x + (player.w / 2) * cos - (player.h / 2) * sin;
                let p2y = player.y + (player.w / 2) * sin + (player.h / 2) * cos;
                let p3x = player.x + (-player.w / 2) * cos - (player.h / 2) * sin;
                let p3y = player.y + (-player.w / 2) * sin + (player.h / 2) * cos;

                let minX = Math.min(p1x, p2x, p3x);
                let maxX = Math.max(p1x, p2x, p3x);
                let maxY = Math.max(p1y, p2y, p3y);

                // --- UPDATE MOVING, ROTATING & TRIGGERED OBSTACLES ---
                for (let obs of obstacles) {
                    let recalculate = false;

                    if (obs.isMoving) {
                        let phase = (1 - Math.cos(timer * obs.speed)) / 2;
                        let cx = obs.startX + (obs.endX - obs.startX) * phase;
                        let cy = obs.startY + (obs.endY - obs.startY) * phase;

                        obs.vertices = [
                            { x: cx, y: cy },
                            { x: cx + obs.w, y: cy },
                            { x: cx + obs.w, y: cy + obs.h },
                            { x: cx, y: cy + obs.h }
                        ];
                        recalculate = true;

                    } else if (obs.isRotating) {
                        let angle = timer * obs.speed;
                        if (obs.initialAngle) angle += obs.initialAngle;

                        let cosA = Math.cos(angle);
                        let sinA = Math.sin(angle);

                        obs.vertices = obs.baseVertices.map(v => {
                            return {
                                x: obs.cx + (v.x * cosA - v.y * sinA),
                                y: obs.cy + (v.x * sinA + v.y * cosA)
                            };
                        });
                        recalculate = true;

                    } else if (obs.isTriggered) {
                        if (obs.isOpen && obs.progress < 1.0) {
                            obs.progress = Math.min(1.0, obs.progress + (obs.speed || 0.02) * dt);
                            let ease = obs.progress * (2 - obs.progress); // easeOutQuad
                            let cx = obs.startX + (obs.endX - obs.startX) * ease;
                            let cy = obs.startY + (obs.endY - obs.startY) * ease;

                            obs.vertices = [
                                { x: cx, y: cy },
                                { x: cx + obs.w, y: cy },
                                { x: cx + obs.w, y: cy + obs.h },
                                { x: cx, y: cy + obs.h }
                            ];
                            recalculate = true;
                        }
                    }

                    if (recalculate) {
                        let normals = [];
                        let obsMinX = Infinity, obsMaxX = -Infinity, obsMinY = Infinity, obsMaxY = -Infinity;

                        for (let i = 0; i < obs.vertices.length; i++) {
                            let v1 = obs.vertices[i];
                            let v2 = obs.vertices[(i + 1) % obs.vertices.length];
                            let dx = v2.x - v1.x;
                            let dy = v2.y - v1.y;
                            let len = Math.sqrt(dx * dx + dy * dy);
                            normals.push({ x: dy / len, y: -dx / len });

                            obsMinX = Math.min(obsMinX, v1.x);
                            obsMaxX = Math.max(obsMaxX, v1.x);
                            obsMinY = Math.min(obsMinY, v1.y);
                            obsMaxY = Math.max(obsMaxY, v1.y);
                        }

                        obs.normals = normals;
                        obs.aabb = { minX: obsMinX, maxX: obsMaxX, minY: obsMinY, maxY: obsMaxY };
                    }
                }

                let hitFloorOrPad = false;
                let onTargetPad = false;
                let onStartPad = false;
                let landedPad = null;

                // --- 2. FLOOR & PAD DETECTION (Like v8.2) ---
                if (maxY >= currentLevel.height) {
                    player.y -= (maxY - currentLevel.height);
                    hitFloorOrPad = true;
                }

                for (let pad of currentLevel.safePads) {
                    if (player.vy >= 0 && maxY >= pad.y && maxY - player.vy * dt <= pad.y + 15) {
                        if (Math.max(minX, pad.x) <= Math.min(maxX, pad.x + pad.w)) {
                            player.y -= (maxY - pad.y);
                            hitFloorOrPad = true;
                            landedPad = pad;
                            if (pad.isTarget) onTargetPad = true;
                            if (pad.isStart) onStartPad = true;
                            break;
                        }
                    }
                }

                // --- 3. FLOOR / PAD OUTCOMES ---
                if (hitFloorOrPad) {
                    const normAngle = getNormalizedAngle();
                    const isUpright = Math.abs(normAngle) <= MAX_ANGLE;
                    const isSlow = Math.abs(player.vx) <= MAX_LAND_VX && Math.abs(player.vy) <= MAX_LAND_VY;

                    if (isUpright && isSlow) {
                        if (landedPad && landedPad.event) {
                            if (state !== 'minigame') {
                                state = 'minigame';
                                activeEvent = landedPad.event;
                                currentMinigame = activeEvent;
                                minigameData = {};

                                if (MINIGAME_REGISTRY[currentMinigame]) {
                                    MINIGAME_REGISTRY[currentMinigame].init(minigameData, landedPad);
                                }

                                player.vx = 0;
                                player.vy = 0;
                                player.angle -= normAngle; // Visual seamless snap
                            }
                        } else if (onTargetPad) {
                            if (state !== 'won' && state !== 'victory') {
                                spawnLandingDust(player.x, player.y + player.h / 2);

                                let targetFinalIndex = customFinalLevel !== null ? customFinalLevel : levels.length - 1;
                                let isFinalLevel = (currentLevelIndex === targetFinalIndex);
                                state = (isFinalLevel && !isPracticeMode && !currentLevel.isTutorial) ? 'victory' : 'won';

                                player.vx = 0;
                                player.vy = 0;
                                player.angle -= normAngle; // Visual seamless snap

                                if (typeof gtag === 'function') {
                                    gtag('event', 'level_up', {
                                        'level_number': currentLevel.isTutorial ? 'Tutorial' : currentLevelIndex + 1,
                                        'version': 'v10'
                                    });
                                }

                                if (!currentLevel.isTutorial) {
                                    let prevBest = saveData.bestLevels[currentLevelIndex];

                                    if (prevBest === null || prevBest === undefined) {
                                        currentSplitStatus = 'NEW';
                                    } else {
                                        currentSplitDelta = timer - prevBest;
                                        if (currentSplitDelta < -0.0005) currentSplitStatus = 'FASTER';
                                        else if (currentSplitDelta > 0.0005) currentSplitStatus = 'SLOWER';
                                        else currentSplitStatus = 'SAME';
                                    }

                                    if (prevBest === null || timer < prevBest) {
                                        saveData.bestLevels[currentLevelIndex] = timer;
                                        storeSaveData();
                                    }

                                    // CAMPAIGN SAVE PROGRESS
                                    if (!isPracticeMode) {
                                        if (isFinalLevel) {
                                            saveData.campaignProgress = 0;
                                        } else {
                                            let nextIndex = currentLevelIndex + 1;
                                            if (saveData.saveFrequency === 'level') {
                                                saveData.campaignProgress = nextIndex;
                                            } else if (saveData.saveFrequency === '10' && nextIndex % 10 === 0) {
                                                saveData.campaignProgress = nextIndex;
                                            }
                                        }
                                        storeSaveData();
                                    }

                                    if (runState === 'active' && !isPracticeMode) {
                                        currentRunIGT += timer;
                                        saveData.casualIGT = currentRunIGT;
                                        saveData.casualRTA = currentRunRTA;
                                        storeSaveData();

                                        if (isFinalLevel) {
                                            victoryData.rta = currentRunRTA;
                                            victoryData.igt = currentRunIGT;
                                            victoryData.invalid = runInvalidated;

                                            if (!runInvalidated) {
                                                victoryData.newRTA = (saveData.bestRTA === null || currentRunRTA < saveData.bestRTA);
                                                victoryData.newIGT = (saveData.bestIGT === null || currentRunIGT < saveData.bestIGT);

                                                if (customFinalLevel === null) {
                                                    if (victoryData.newRTA) saveData.bestRTA = currentRunRTA;
                                                    if (victoryData.newIGT) saveData.bestIGT = currentRunIGT;
                                                    storeSaveData();
                                                }
                                            } else {
                                                victoryData.newRTA = false;
                                                victoryData.newIGT = false;
                                            }

                                            runState = 'inactive';
                                        }
                                    }
                                } else {
                                    let prevBest = saveData.bestTutorial;

                                    if (prevBest === null || prevBest === undefined) {
                                        currentSplitStatus = 'NEW';
                                    } else {
                                        currentSplitDelta = timer - prevBest;
                                        if (currentSplitDelta < -0.0005) currentSplitStatus = 'FASTER';
                                        else if (currentSplitDelta > 0.0005) currentSplitStatus = 'SLOWER';
                                        else currentSplitStatus = 'SAME';
                                    }

                                    if (prevBest === null || timer < prevBest) {
                                        saveData.bestTutorial = timer;
                                        storeSaveData();
                                    }
                                }
                            }
                        } else {
                            player.vy = 0;
                            player.vx *= 0.85;
                            // Fix angle snap glitch: gently pull the normalized angle towards 0
                            player.angle -= normAngle * 0.2;

                            // Only reset time if landing securely on the launch pad
                            if (onStartPad) {
                                timer = 0;
                                timerRunning = false;
                                hasMoved = false;
                            }
                        }
                    } else {
                        crashedThisFrame = true; // Landed too hard or tilted!
                    }
                } else {
                    // --- 4. SAT OBSTACLE DETECTION (Strict touch = crash rule from v8.2) ---
                    let circle = { x: player.x, y: player.y, r: shipRadius };

                    for (let obs of obstacles) {
                        // Broad phase check
                        if (circle.x + circle.r < obs.aabb.minX || circle.x - circle.r > obs.aabb.maxX ||
                            circle.y + circle.r < obs.aabb.minY || circle.y - circle.r > obs.aabb.maxY) {
                            continue;
                        }

                        // Strict, robust Narrow phase (SAT)
                        if (testCirclePolygon(circle, obs)) {
                            crashedThisFrame = true;
                            break;
                        }
                    }
                }

                // --- 5. FINALIZE CRASH ---
                if (crashedThisFrame && state !== 'won' && state !== 'victory') {
                    state = 'lost';
                    spawnExplosion(player.x, player.y);
                }

                // Timer Management Fix
                if (hasMoved && state === 'playing' && !timerRunning) {
                    timerRunning = true;
                }

                if (state === 'won' || state === 'victory' || state === 'lost') {
                    timerRunning = false;
                }

                if (timerRunning) {
                    timer += dt / 60;
                }
            }

            updateCamera();
        }

        for (let p of ambientDust) {
            p.x += p.baseVx * dt;
            p.y += p.baseVy * dt;
            while (p.x < camera.x - 100) p.x += canvas.width + 200;
            while (p.x > camera.x + canvas.width + 100) p.x -= canvas.width + 200;
            while (p.y < camera.y - 100) p.y += canvas.height + 200;
            while (p.y > camera.y + canvas.height + 100) p.y -= canvas.height + 200;
        }

        for (let i = 0; i < particles.length; i++) {
            let p = particles[i];
            if (!p.active) continue;

            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.life -= (p.type === 'explosion' ? 0.015 : 0.05) * dt;

            if (p.life <= 0) {
                p.active = false;
            }
        }
    }

    function drawHUDText(label, value, isSafe, x, y) {
        ctx.shadowBlur = 4;
        ctx.shadowColor = '#000';
        ctx.fillStyle = isSafe ? '#0f0' : '#ff3333';
        ctx.fillText(`${label}: ${value}`, x, y);
        ctx.shadowBlur = 0;
    }

    function drawHUD() {
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'left';

        let hudY = 30;

        drawHUDText('VX', Math.abs(player.vx).toFixed(2), Math.abs(player.vx) <= MAX_LAND_VX, 20, hudY); hudY += 20;
        drawHUDText('VY', player.vy.toFixed(2), player.vy <= MAX_LAND_VY, 20, hudY); hudY += 20;

        const normAngle = getNormalizedAngle();
        const degrees = Math.abs(normAngle * 180 / Math.PI);
        drawHUDText('ANG', `${degrees.toFixed(0)}°`, degrees <= MAX_LAND_ANGLE_DEG, 20, hudY); hudY += 20;

        if (player.maxFuel !== Infinity) {
            let fuelPct = (player.fuel / player.maxFuel) * 100;
            drawHUDText('FUEL', fuelPct.toFixed(0) + '%', fuelPct > 20, 20, hudY); hudY += 20;
        }

        if (saveData.showTimer) {
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#000';
            ctx.fillText(`TIME: ${timer.toFixed(3)}s`, 20, hudY); hudY += 20;
            ctx.shadowBlur = 0;
        }

        if (empActive) {
            ctx.fillStyle = '#ff3333';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#000';
            ctx.fillText(`WARN: EMP ACTIVE`, 20, hudY); hudY += 20;
            ctx.shadowBlur = 0;
        } else if (currentLevel.zeroGravity) {
            ctx.fillStyle = '#0ff';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#000';
            ctx.fillText(`WARN: ZERO-G ACTIVE`, 20, hudY); hudY += 20;
            ctx.shadowBlur = 0;
        }

        if (runState === 'active' && saveData.showTimer) {
            ctx.fillStyle = '#00ffcc';
            ctx.fillText(`RTA: ${currentRunRTA.toFixed(3)}s`, 20, hudY); hudY += 20;
            let liveIGT = currentRunIGT + (timerRunning ? timer : timer);
            ctx.fillText(`IGT: ${liveIGT.toFixed(3)}s`, 20, hudY); hudY += 20;
        }

        if (cheatsEnabled) {
            ctx.fillStyle = '#f0f';
            ctx.textAlign = 'right';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#f0f';

            let displayStr = "DEV MODE ACTIVE";
            if (activeCheatPrefix) displayStr += ` [${activeCheatPrefix.toUpperCase()}_]`;

            ctx.fillText(displayStr, canvas.width - 20, 30);
        }

        ctx.shadowBlur = 0;

        if (currentLevel.isTutorial) {
            ctx.fillStyle = '#0ff';
            ctx.textAlign = 'center';
            ctx.font = 'bold 24px monospace';
            ctx.shadowBlur = 4;
            ctx.shadowColor = '#000';

            let pX = player.x;
            let pY = player.y;

            if (pX < 500 && pY > 800) {
                ctx.fillText("Welcome to RETROGRADE. Your goal is to land safely.", canvas.width / 2, 80);
                ctx.fillText("Hold [W] or [UP] to fire your main thruster and climb.", canvas.width / 2, 110);
            } else if (pX < 800) {
                ctx.fillText("Use [A] and [D] or [LEFT]/[RIGHT] to rotate your ship.", canvas.width / 2, 80);
                ctx.fillText("Point your ship to the right and thrust to cross the gap!", canvas.width / 2, 110);
            } else if (pX < 1900) {
                ctx.fillText("Gravity is constantly pulling you down.", canvas.width / 2, 80);
                ctx.fillText("Feather your thrust to hover while moving forward.", canvas.width / 2, 110);
            } else if (pY < 800) {
                ctx.fillText("The landing pad is below. Ease off the thrust to fall.", canvas.width / 2, 80);
            } else {
                ctx.fillText("Check your HUD on the left!", canvas.width / 2, 80);
                ctx.fillText("Speed (VX/VY) and Angle (ANG) MUST be GREEN to survive touchdown.", canvas.width / 2, 110);
            }
            ctx.shadowBlur = 0;
        }
    }

    function drawMenuUI() {
        if (menuScreen === 'main' || menuScreen === 'practice') {
            ctx.textAlign = 'center';
            ctx.font = 'bold 64px monospace';
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#0ff';
            ctx.fillText("RETROGRADE", canvas.width / 2, 110);
            ctx.shadowBlur = 0;
        }

        if (menuScreen === 'main') {
            const buttons = [
                { text: 'NEW GAME', type: 'play', y: 160 },
                { text: 'CONTINUE', type: 'continue', y: 230 },
                { text: 'PRACTICE', type: 'practice', y: 300 },
                { text: 'TUTORIAL', type: 'tutorial', y: 370 },
                { text: 'TIMES', type: 'times', y: 440 },
                { text: 'SAVE', type: 'save', y: 510 },
                { text: 'LOAD', type: 'load', y: 580 },
                { text: 'SETTINGS', type: 'settings', y: 650 }
            ];

            ctx.font = 'bold 24px monospace';
            let isContinueDisabled = isSpeedrunMode || saveData.campaignProgress === 0;

            buttons.forEach(b => {
                const isHover = mouseX > canvas.width/2 - 100 && mouseX < canvas.width/2 + 100 &&
                    mouseY > b.y && mouseY < b.y + 50;

                if (b.type === 'continue' && isContinueDisabled) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                    ctx.fillRect(canvas.width/2 - 100, b.y, 200, 50);
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(canvas.width/2 - 100, b.y, 200, 50);
                    ctx.fillStyle = '#555';
                    ctx.fillText(b.text, canvas.width/2, b.y + 32);
                } else {
