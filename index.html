                    ctx.fillRect(canvas.width/2 - 100, b.y, 200, 50);

    function draw() {
        ctx.fillStyle = currentLevel.theme?.bg || '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (currentLevel.theme && currentLevel.theme.parallaxType) {
            for(let layer of parallaxLayers) {
                ctx.fillStyle = layer.color;

                let offsetX = ((camera.x * layer.speed) % layer.loopWidth + layer.loopWidth) % layer.loopWidth;
                let offsetY = camera.y * layer.speed;

                for (let i = 0; i < 2; i++) {
                    ctx.save();
                    ctx.translate(-offsetX + (i * layer.loopWidth), -offsetY);
                    for(let s of layer.shapes) {
                        if(s.type === 'peak') {
                            ctx.beginPath();
                            ctx.moveTo(s.x, s.y);
                            ctx.lineTo(s.x + s.w/2, s.y - s.h);
                            ctx.lineTo(s.x + s.w, s.y);
                            ctx.fill();
                        } else if (s.type === 'rect') {
                            ctx.fillRect(s.x, s.y, s.w, s.h);
                        } else if (s.type === 'star') {
                            ctx.beginPath();
                            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    ctx.restore();
                }
            }
        }

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
        for (let x = 0; x <= currentLevel.width; x += 100) {
            for (let y = 0; y <= currentLevel.height; y += 100) {
                ctx.fillRect(x, y, 2, 2);
            }
        }

        // Render AoE Zones Backgrounds & Wind/Portal Effects
        if (state !== 'menu' && activeZones.length > 0) {
            for (let zone of activeZones) {
                ctx.fillStyle = zone.color || 'rgba(255, 255, 255, 0.1)';
                ctx.fillRect(zone.x, zone.y, zone.w, zone.h);

                if (saveData.visualEffects === 'high') {
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(zone.x, zone.y, zone.w, zone.h);
                    ctx.clip();

                    if (zone.type === 'emp') {
                        // Scanning disruptor line
                        let scanY = (timer * 200) % zone.h;
                        ctx.fillStyle = 'rgba(255, 255, 0, 0.4)';
                        ctx.fillRect(zone.x, zone.y + scanY, zone.w, 8);

                        // Static noise overlay
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                        for (let i=0; i<10; i++) {
                            let sx = zone.x + Math.random() * zone.w;
                            let sy = zone.y + Math.random() * zone.h;
                            ctx.fillRect(sx, sy, Math.random()*20+10, 2);
                        }
                    } else if (zone.type === 'boost') {
                        // Pulsing borders
                        let pulse = (1 + Math.sin(timer * 15)) / 2;
                        ctx.lineWidth = 4 + pulse * 4;
                        ctx.strokeStyle = `rgba(0, 255, 255, ${0.8 - pulse * 0.5})`;
                        ctx.strokeRect(zone.x + 2, zone.y + 2, zone.w - 4, zone.h - 4);
                    } else if (zone.type === 'portal' || zone.type === 'portal_exit') {
                        // Glowing portal effect (bloom)
                        let pulse = (1 + Math.sin(timer * 5)) / 2;
                        let portalColor = zone.color || 'rgba(200, 0, 255, 0.5)';

                        ctx.shadowBlur = 15 + pulse * 20;
                        ctx.shadowColor = portalColor;
                        ctx.strokeStyle = portalColor;
                        ctx.lineWidth = 2 + pulse * 2;

                        ctx.strokeRect(zone.x, zone.y, zone.w, zone.h);
                        ctx.fillStyle = portalColor.replace('0.4', '0.1').replace('0.5', '0.1'); // slight fill
                        ctx.fillRect(zone.x, zone.y, zone.w, zone.h);
                        ctx.shadowBlur = 0;
                    } else {
                        // Wind logic
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                        ctx.lineWidth = 1.5;
                        ctx.beginPath();

                        let forceMag = Math.sqrt((zone.forceX||0)*(zone.forceX||0) + (zone.forceY||0)*(zone.forceY||0));
                        if (forceMag > 0) {
                            let numLines = Math.floor((zone.w * zone.h) / 8000);
                            let speed = forceMag * 400; // Visual wind speed scalar
                            let angle = Math.atan2(zone.forceY, zone.forceX);
                            let cosA = Math.cos(angle);
                            let sinA = Math.sin(angle);

                            for (let i = 0; i < numLines; i++) {
                                // Seeded pseudo-random coordinates
                                let seedX = (i * 9301 + 49297) % 233280 / 233280;
                                let seedY = (i * 49297 + 9301) % 233280 / 233280;

                                let lineX = seedX * zone.w;
                                let lineY = seedY * zone.h;

                                let moveDist = timer * speed + (i * 100);

                                let drawX = (lineX + moveDist * cosA) % zone.w;
                                if (drawX < 0) drawX += zone.w;

                                let drawY = (lineY + moveDist * sinA) % zone.h;
                                if (drawY < 0) drawY += zone.h;

                                let absX = zone.x + drawX;
                                let absY = zone.y + drawY;

                                ctx.moveTo(absX, absY);
                                ctx.lineTo(absX - 15 * cosA, absY - 15 * sinA);
                            }
                        }
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            }
        }

        // Draw Keys / Fuel Items
        if (state !== 'menu' && activeItems.length > 0) {
            for (let item of activeItems) {
                if (!item.collected) {
                    ctx.save();
                    ctx.translate(item.x, item.y);
                    let bounce = Math.sin(timer * 3) * 5;
                    ctx.translate(0, bounce);

                    if (item.type === 'key') {
                        ctx.fillStyle = item.color || '#FFD700';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = item.color || '#FFD700';
                        ctx.rotate(timer * 2);
                        ctx.beginPath();
                        ctx.moveTo(0, -12);
                        ctx.lineTo(12, 0);
                        ctx.lineTo(0, 12);
                        ctx.lineTo(-12, 0);
                        ctx.closePath();
                        ctx.fill();
                    } else if (item.type === 'fuel') {
                        ctx.fillStyle = '#0f0';
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#0f0';
                        ctx.fillRect(-10, -14, 20, 28);
                        ctx.fillStyle = '#000';
                        ctx.font = 'bold 12px monospace';
                        ctx.textAlign = 'center';
                        ctx.shadowBlur = 0;
                        ctx.fillText("F", 0, 4);
                    }
                    ctx.restore();
                }
            }
        }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        for(let p of ambientDust) {
            ctx.fillRect(p.x, p.y, 2, 2);
        }

        ctx.restore();
        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        if (state !== 'menu') {
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, currentLevel.width, currentLevel.height);
            ctx.strokeStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(0, currentLevel.height);
            ctx.lineTo(currentLevel.width, currentLevel.height);
            ctx.stroke();

            // Rendering Custom Arbitrary Polygons
            for (let obs of obstacles) {
                ctx.fillStyle = currentLevel.theme?.obj || '#334155';
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(obs.vertices[0].x, obs.vertices[0].y);
                for(let i = 1; i < obs.vertices.length; i++) {
                    ctx.lineTo(obs.vertices[i].x, obs.vertices[i].y);
                }
                ctx.closePath();

                ctx.fill();
                ctx.stroke();
            }

            for (let pad of currentLevel.safePads) {
                ctx.strokeStyle = pad.isTarget ? '#00FF00' : '#fff';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(pad.x, pad.y);
                ctx.lineTo(pad.x + pad.w, pad.y);
                ctx.stroke();

                ctx.fillStyle = pad.isTarget ? '#00FF00' : '#fff';
                ctx.textAlign = 'center';
                ctx.font = 'bold 14px monospace';

                let text = "SAFE PAD";
                if (pad.isStart) text = "LAUNCH PAD";
                if (pad.isTarget) text = "LANDING PAD";

                ctx.fillText(text, pad.x + (pad.w / 2), pad.y + 20);

                if (pad.isStart) {
                    let targetPad = currentLevel.safePads.find(p => p.isTarget);
                    if (targetPad) {
                        let startCx = pad.x + pad.w / 2;
                        let startCy = pad.y;
                        let targetCx = targetPad.x + targetPad.w / 2;
                        let targetCy = targetPad.y;

                        let angle = Math.atan2(targetCy - startCy, targetCx - startCx);

                        ctx.save();
                        ctx.translate(startCx, startCy - 40);
                        ctx.rotate(angle);

                        ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#0ff';

                        ctx.beginPath();
                        ctx.moveTo(25, 0);
                        ctx.lineTo(5, 10);
                        ctx.lineTo(5, -10);
                        ctx.closePath();
                        ctx.fill();

                        ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([5, 5]);
                        ctx.beginPath();
                        ctx.moveTo(25, 0);
                        ctx.lineTo(100, 0);
                        ctx.stroke();

                        ctx.restore();
                    }
                }
            }
        }

        let lightColor = currentLevel.theme?.light || '255, 255, 255';

        ctx.save();
        ctx.globalCompositeOperation = 'screen';

        for (let i = 0; i < particles.length; i++) {
            let p = particles[i];
            if (!p.active) continue;

            if (p.type === 'explosion') {
                ctx.fillStyle = `rgba(255, 255, 255, ${p.life})`;
                ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
            } else if (p.type === 'spark') {
                ctx.fillStyle = `rgba(255, 255, 200, ${p.life * 1.5})`;
                ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
            } else if (p.type === 'exhaust') {
                let size = 3 + (1.0 - p.life) * 12;
                let alpha = p.life * 0.6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${lightColor}, ${alpha})`;
                ctx.fill();
            }
        }

        function drawShipEntity(shipObj, flickerAmount) {
            ctx.save();
            ctx.translate(shipObj.x, shipObj.y);
            ctx.rotate(shipObj.angle);

            let activeFlicker = flickerAmount > 0 ? flickerAmount * (0.8 + Math.random()*0.2) : 0;
            if (activeFlicker > 0.01) {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                let ambientGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 500);
                ambientGrad.addColorStop(0, `rgba(${lightColor}, ${0.15 * activeFlicker})`);
                ambientGrad.addColorStop(1, `rgba(${lightColor}, 0)`);
                ctx.fillStyle = ambientGrad;
                ctx.fillRect(-500, -500, 1000, 1000);

                ctx.translate(0, 15);
                ctx.scale(1, 1.5);

                let flareGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 18);
                flareGrad.addColorStop(0, `rgba(255, 255, 255, ${activeFlicker})`);
                flareGrad.addColorStop(0.3, `rgba(${lightColor}, ${0.8 * activeFlicker})`);
                flareGrad.addColorStop(1, `rgba(${lightColor}, 0)`);
                ctx.fillStyle = flareGrad;
                ctx.beginPath();
                ctx.arc(0, 0, 18, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = '#000000';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(0, -shipObj.h / 2);
            ctx.lineTo(shipObj.w / 2, shipObj.h / 2);
            ctx.lineTo(-shipObj.w / 2, shipObj.h / 2);
            ctx.closePath();

            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }

        ctx.restore();

        if (state !== 'lost' && state !== 'menu') {
            drawShipEntity(player, thrusterFlicker);
        }

        if (state === 'menu' && menuShip.active) {
            drawShipEntity(menuShip, menuShip.visualThrust);
        }

        ctx.restore();

        if (state === 'victory') {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            ctx.font = 'bold 64px monospace';
            ctx.fillStyle = '#0ff';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#0ff';
            ctx.fillText("MISSION COMPLETE", canvas.width / 2, 180);
            ctx.shadowBlur = 0;

            if (victoryData.invalid) {
                ctx.font = 'bold 32px monospace';
                ctx.fillStyle = '#fff';
                ctx.fillText("CASUAL CLEAR", canvas.width / 2, 250);

                ctx.font = '20px monospace';
                ctx.fillStyle = '#ff5555';
                ctx.fillText("Run Not Eligible for Speedrun Leaderboard.", canvas.width / 2, 280);
            } else {
                ctx.font = 'bold 32px monospace';
                ctx.fillStyle = '#fff';
                ctx.fillText("FULL RUN CLEAR", canvas.width / 2, 250);
            }

            ctx.fillStyle = 'rgba(0, 10, 20, 0.8)';
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 4;
            ctx.fillRect(canvas.width / 2 - 320, 320, 300, 160);
            ctx.strokeRect(canvas.width / 2 - 320, 320, 300, 160);

            ctx.fillRect(canvas.width / 2 + 20, 320, 300, 160);
            ctx.strokeRect(canvas.width / 2 + 20, 320, 300, 160);

            ctx.font = 'bold 24px monospace';
            ctx.fillStyle = '#00ffcc';
            ctx.fillText("REAL TIME (RTA)", canvas.width / 2 - 170, 360);
            ctx.fillStyle = '#fff';
            ctx.font = '36px monospace';
            ctx.fillText(`${victoryData.rta.toFixed(3)}s`, canvas.width / 2 - 170, 410);
            if (victoryData.newRTA) {
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 20px monospace';
                ctx.fillText("NEW PERSONAL BEST!", canvas.width / 2 - 170, 450);
            }

            ctx.font = 'bold 24px monospace';
            ctx.fillStyle = '#00ffcc';
            ctx.fillText("IN-GAME (IGT)", canvas.width / 2 + 170, 360);
            ctx.fillStyle = '#fff';
            ctx.font = '36px monospace';
            ctx.fillText(`${victoryData.igt.toFixed(3)}s`, canvas.width / 2 + 170, 410);
            if (victoryData.newIGT) {
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 20px monospace';
                ctx.fillText("NEW PERSONAL BEST!", canvas.width / 2 + 170, 450);
            }

            ctx.fillStyle = '#fff';
            ctx.font = '20px monospace';
            let pulse = Math.abs(Math.sin(Date.now() / 300));
            ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + pulse * 0.6})`;
            ctx.fillText(">> PRESS [ESC] TO RETURN TO MENU <<", canvas.width / 2, 580);
            return;
        }

        if (state === 'menu') {
            drawMenuUI();
        } else {

            drawHUD();

            if (state === 'lost' || state === 'won') {
                const boxW = 500;
                const boxH = state === 'won' ? 240 : 200;
                const boxX = canvas.width / 2 - boxW / 2;
                const boxY = canvas.height / 2 - boxH / 2;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(boxX, boxY, boxW, boxH);

                const mainColor = state === 'lost' ? '#ff3333' : '#0ff';
                ctx.strokeStyle = mainColor;
                ctx.lineWidth = 4;
                ctx.strokeRect(boxX, boxY, boxW, boxH);

                ctx.textAlign = 'center';
                ctx.fillStyle = '#fff';

                if (state === 'lost') {
                    ctx.font = 'bold 40px monospace';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#f00';
                    ctx.fillText("CRASHED", canvas.width / 2, boxY + 70);

                    ctx.shadowBlur = 0;
                    ctx.font = '18px monospace';
                    ctx.fillText("Press [R] to Retry", canvas.width / 2, boxY + 140);
                } else {
                    ctx.font = 'bold 36px monospace';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#0ff';

                    if (currentLevel.isTutorial) {
                        ctx.fillText("TUTORIAL CLEARED", canvas.width / 2, boxY + 50);
                    } else if (isPracticeMode) {
                        ctx.fillText("PRACTICE CLEARED", canvas.width / 2, boxY + 50);
                    } else {
                        ctx.fillText("SUCCESS", canvas.width / 2, boxY + 50);
                    }

                    ctx.shadowBlur = 0;
                    ctx.font = 'bold 24px monospace';
                    ctx.fillStyle = '#0ff';
                    ctx.fillText(`TIME: ${timer.toFixed(3)}s`, canvas.width / 2, boxY + 95);

                    ctx.font = 'bold 20px monospace';
                    if (currentSplitStatus === 'NEW') {
                        ctx.fillStyle = '#FFD700';
                        ctx.shadowColor = '#FFD700';
                        ctx.shadowBlur = 10;
                        ctx.fillText("NEW PB!", canvas.width / 2, boxY + 130);
                    } else if (currentSplitStatus === 'FASTER') {
                        ctx.fillStyle = '#0f0';
                        ctx.shadowColor = '#0f0';
                        ctx.shadowBlur = 10;
                        ctx.fillText(`-${Math.abs(currentSplitDelta).toFixed(3)}s PB!`, canvas.width / 2, boxY + 130);
                    } else if (currentSplitStatus === 'SLOWER') {
                        ctx.fillStyle = '#f00';
                        ctx.fillText(`+${currentSplitDelta.toFixed(3)}s`, canvas.width / 2, boxY + 130);
                    } else {
                        ctx.fillStyle = '#888';
                        ctx.fillText(`+0.000s`, canvas.width / 2, boxY + 130);
                    }
                    ctx.shadowBlur = 0;

                    ctx.font = '18px monospace';
                    ctx.fillStyle = '#fff';

                    if (currentLevel.isTutorial) {
                        ctx.fillStyle = '#0ff';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#0ff';
                        ctx.fillText("HOLD [ESC] TO EXIT TO MAIN MENU", canvas.width / 2, boxY + 190);
                        ctx.shadowBlur = 0;
                    } else if (isPracticeMode) {
                        ctx.fillText("Press [ENTER] to Restart", canvas.width / 2, boxY + 190);
                    } else {
                        ctx.fillText("Press [ENTER] to Proceed", canvas.width / 2, boxY + 190);
                    }
                }
            }

            if (state !== 'menu' && tHoldTimer > 0 && !tTriggeredReset) {
                let barWidth = 300;
                let barHeight = 24;
                let pct = Math.min(1.0, tHoldTimer / 0.5);
                let barX = canvas.width / 2 - barWidth / 2;
                let barY = canvas.height - 94;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(barX, barY, barWidth, barHeight);

                ctx.fillStyle = '#ff0';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0';
                ctx.fillRect(barX, barY, barWidth * pct, barHeight);
                ctx.shadowBlur = 0;

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(barX, barY, barWidth, barHeight);

                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.font = 'bold 16px monospace';
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#000';
                ctx.fillText("HOLD T TO RESTART RUN", canvas.width / 2, barY - 10);
                ctx.shadowBlur = 0;
            }

            if (state !== 'menu' && escHoldTimer > 0) {
                let barWidth = 300;
                let barHeight = 24;
                let pct = Math.min(1.0, escHoldTimer / 1.0);
                let barX = canvas.width / 2 - barWidth / 2;
                let barY = canvas.height - 60;

                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(barX, barY, barWidth, barHeight);

                ctx.fillStyle = '#0ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0ff';
                ctx.fillRect(barX, barY, barWidth * pct, barHeight);
                ctx.shadowBlur = 0;

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.strokeRect(barX, barY, barWidth, barHeight);

                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.font = 'bold 16px monospace';
                ctx.shadowBlur = 4;
                ctx.shadowColor = '#000';
                ctx.fillText("HOLD ESC TO QUIT", canvas.width / 2, barY - 10);
                ctx.shadowBlur = 0;
            }
        }

        if (terminalActive) {
            const termW = 600, termH = 80;
            const termX = canvas.width / 2 - termW / 2;
            const termY = canvas.height / 2 - termH / 2;

            ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
            ctx.fillRect(termX, termY, termW, termH);

            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.strokeRect(termX, termY, termW, termH);

            ctx.fillStyle = '#0ff';
            ctx.font = 'bold 24px monospace';
            ctx.textAlign = 'left';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#0ff';

            const cursor = Math.floor(Date.now() / 500) % 2 === 0 ? '_' : ' ';
            ctx.fillText(`> ${terminalInput}${cursor}`, termX + 20, termY + 48);
            ctx.shadowBlur = 0;
        }

        if (isPaused) {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffcc';
            ctx.textAlign = 'center';
            ctx.font = 'bold 48px monospace';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ffcc';
            ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2 - 20);

            ctx.shadowBlur = 0;
            ctx.font = 'bold 20px monospace';
            let pulse = Math.abs(Math.sin(Date.now() / 300));
            ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + pulse * 0.6})`;
            ctx.fillText(">> PRESS [ENTER] TO RESUME <<", canvas.width / 2, canvas.height / 2 + 30);
        }

        if (transitionAlpha > 0) {
            ctx.fillStyle = `rgba(0, 0, 0, ${transitionAlpha})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = `rgba(255, 255, 255, ${transitionAlpha * 0.15})`;
            for (let i = 0; i < 30; i++) {
                ctx.fillRect(0, Math.random() * canvas.height, canvas.width, Math.random() * 4 + 1);
            }
        }
    }

    function gameLoop(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;

        if (runState === 'active' && state !== 'menu' && state !== 'victory') {
            currentRunRTA += deltaTime / 1000;
            rtaSaveTimer += deltaTime;

            // Save casual time 10 times a second
            if (rtaSaveTimer >= 100) {
                saveData.casualRTA = currentRunRTA;
                storeSaveData();
                rtaSaveTimer = 0;
            }
        }

        let dt = deltaTime / (1000 / 60);
        if (dt > 3.0) dt = 3.0;

        if (state === 'minigame') {
            updateMinigame(dt);
            draw(); // Keep rendering the level background behind it
            drawMinigame(); // Draw UI on top
        } else {
            update(dt);
            draw();
        }

        requestAnimationFrame(gameLoop);
    }

    goToMenu();
    requestAnimationFrame(gameLoop);
</script>
</body>
</html>
